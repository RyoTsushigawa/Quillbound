const TYPE_LABEL={adventure:'Adventure',cards:'Card pack',supplement:'Supplement',maps:'Map pack',handouts:'Handouts',other:'Other'};
const SYS_LABEL={'5e':'D&D 5e',coc:'Call of Cthulhu',pf2:'Pathfinder 2e',dsa:'Das Schwarze Auge'};
const fmtSize=b=>b>1e6?(b/1e6).toFixed(b>1e8?0:1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
function vImport(){
  const I=S.importer;
  if(I.phase==='results'&&I.result) return vResults();
  if(I.phase==='product'&&I.lib&&I.lib.products[I.pi]) return vProduct();
  return vLibrary();
}
function dropZone(){
  const I=S.importer;
  return `<div class="card stack">
    <div class="drop" id="drop"><b>Drop adventure folders, zips or PDFs</b><span class="small muted">Whole folders work, with everything inside them.</span>
      <div class="row" style="justify-content:center;margin-top:6px"><label class="btn sm" for="lib-folder">Choose a folder</label><label class="btn sm" for="lib-files">Choose files</label></div>
      <input type="file" id="lib-folder" webkitdirectory multiple hidden><input type="file" id="lib-files" multiple accept=".pdf,.zip,.jpg,.jpeg,.png,.webp,.tif,.tiff" hidden></div>
    <p class="small muted">Nothing is uploaded. Files are read on this computer and only kept while this page is open.</p>
    ${I.busy?`<div class="readout"><div style="color:var(--accent)">${esc(I.status||'Working…')}</div></div>`:I.status?`<div class="readout"><div style="color:var(--warn)">${esc(I.status)}</div></div>`:''}
    ${I.lib?`<div class="readout"><div><b>${I.lib.files}</b> files · <b>${I.lib.products.length}</b> products</div>${I.lib.mirrors.length?`<div>${I.lib.mirrors.length} zip${I.lib.mirrors.length>1?'s':''} also unpacked next to ${I.lib.mirrors.length>1?'themselves':'itself'}: copies set aside</div>`:''}<div class="row"><button class="btn sm primary" data-act="lib-readall" ${I.busy?'disabled':''}>Read all adventures for a campaign</button><button class="btn sm ghost" data-act="lib-clear">Clear the library</button></div></div>`:''}
    <div class="mode"><div class="eyebrow">Read on this device</div><p class="small">No account is needed. The PDF reader may need internet the first time it loads. The PDF must contain selectable text; pictures of pages cannot be read yet.</p></div>
  </div>`;
}
function bookVersions(g){ return g.files.filter(f=>!f.copyOf).length; }
function vLibrary(){
  const L=S.importer.lib;
  const list=!L?`<div class="card stack"><h3>What happens when you drop a folder</h3><ul class="list">
      <li>Files that belong to one adventure are grouped, even across zips, loose PDFs and map folders.</li>
      <li>Copies are set aside: a zip and the same folder unpacked, or the same file twice under different names.</li>
      <li>Versions are told apart: color or print-friendly, DM or player map, with or without grid, v1 or v3, condensed.</li>
      <li>Then you open an adventure and the reader turns the book into scenes, leads, people, enemies, places, items and roll tables.</li></ul></div>`
    :`<div class="prods">${L.products.map(p=>{
      const book=p.groups.find(g=>g.kind==='book');
      const parts=[book?`${bookVersions(book)>1?bookVersions(book)+' versions of the book':'the book'}`:'',
        p.counts.map?`${p.counts.map} map file${p.counts.map>1?'s':''}`:'', p.counts.cards?`${p.counts.cards} card sheet${p.counts.cards>1?'s':''}`:'',
        p.counts.handout?`${p.counts.handout} handout${p.counts.handout>1?'s':''}`:'', p.counts.supplement?`${p.counts.supplement} supplement file${p.counts.supplement>1?'s':''}`:'',
        p.counts.template?`${p.counts.template} blank template${p.counts.template>1?'s':''}`:'', p.counts.cover?'cover':''].filter(Boolean);
      return `<button class="choice prod" data-act="lib-open" data-v="${p.i}">
        <div class="meta"><span class="chip ${p.type==='adventure'?'acc':''}">${TYPE_LABEL[p.type]||p.type}</span><span class="row" style="gap:4px">${p.system?`<span class="chip gold">${SYS_LABEL[p.system]||p.system}</span>`:''}${p.language==='de'?'<span class="chip">Deutsch</span>':''}</span></div>
        <div class="pitch">${esc(p.name)}</div>
        <div class="desc">${parts.join(' · ')||'—'}</div>
        ${p.duplicates?`<div class="small muted">${p.duplicates} duplicate cop${p.duplicates>1?'ies':'y'} set aside</div>`:''}
        ${(S.adventures||[]).some(a=>a.product===p.name)?'<div class="small" style="color:var(--ok)">Read · in the campaign planner</div>':''}</button>`;}).join('')}</div>`;
  return `<div class="pagehead"><div><div class="eyebrow">Adventure library · for DMs</div><h2>Bring in your adventures</h2><p>Drop the folders you bought or downloaded. Quillbound sorts out what belongs together and which file is which version, then reads the book for you.</p></div></div>
  <div class="imp">${dropZone()}<div style="min-width:0">${list}</div></div>`;
}
function vProduct(){
  const I=S.importer, p=I.lib.products[I.pi];
  const order=['book','map','cards','handout','supplement','cover','screen','image','template','legal'];
  const groups=p.groups.map((g,gi)=>({...g,gi})).sort((a,b)=>order.indexOf(a.kind)-order.indexOf(b.kind));
  const verdictChip=v=>!v?'':(v.garbled>5?`<span class="chip bad">${v.garbled}% unreadable text</span>`:'')+(v.verdict==='reference'?'<span class="chip">compared against this</span>':v.verdict==='same text'?`<span class="chip ok">same text (${v.similarity}%)</span>`:v.verdict==='revised text'?`<span class="chip warn">revised text (${v.similarity}%)</span>`:v.verdict==='different text'?`<span class="chip bad">different text (${v.similarity}%)</span>`:`<span class="chip bad">${esc(v.verdict)}</span>`);
  const fileRow=(g,f)=>{const v=(I.versions[I.pi+':'+g.gi]||[]).find(x=>x.path===f.path);
    return `<div class="frow ${f.copyOf?'copy':''}"><span class="star" title="${f.path===g.primary?'Recommended':''}">${f.path===g.primary?'★':''}</span>
      <span class="fname" title="${esc(f.path)}">${esc(f.name)}</span>
      <span class="row" style="gap:4px">${f.variant&&f.variant!=='original'?f.variant.split(' · ').map(t=>`<span class="chip">${esc(t)}</span>`).join(''):''}${f.copyOf?`<span class="chip">copy of ${esc(f.copyOf)}</span>`:''}${f.inZip&&!f.copyOf&&p.sources>1?`<span class="chip">in ${esc(f.inZip)}</span>`:''}${verdictChip(v)}</span>
      <span class="small muted mono">${fmtSize(f.size)}</span>
      ${f.previewable&&!f.copyOf?`<span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm" data-act="lib-preview" data-path="${esc(f.path)}">View</button><button class="btn sm ${f.tags.audience==='dm'?'warnbtn':''}" data-act="lib-show" data-path="${esc(f.path)}" title="${f.tags.audience==='dm'?'This is the DM version: labels and secrets will be visible':'Show this image on the player screen'}">${f.tags.audience==='dm'?'Show players (DM version!)':'Show players'}</button></span>`:/\.tiff?$/i.test(f.name)?'<span class="small muted">TIFF: open outside</span>':''}</div>`;};
  const sections=order.map(k=>{const gs=groups.filter(g=>g.kind===k); if(!gs.length) return '';
    return `<div class="card stack"><div class="col-h"><h3>${esc(gs[0].kindLabel)}</h3><span class="small muted">${gs.length} item${gs.length>1?'s':''}</span></div>
      ${gs.map(g=>`<div class="grp"><div class="row" style="justify-content:space-between"><b>${esc(g.label)}</b>${k==='book'&&bookVersions(g)>1?`<button class="btn sm" data-act="lib-compare" data-v="${g.gi}" ${I.busy?'disabled':''}>Compare versions</button>`:''}</div>
        ${g.files.map(f=>fileRow(g,f)).join('')}</div>`).join('')}</div>`;}).join('');
  return `<div class="pagehead"><div><button class="btn sm ghost" data-act="lib-back">← All products</button><div class="eyebrow" style="margin-top:8px">${TYPE_LABEL[p.type]}${p.system?' · '+(SYS_LABEL[p.system]||p.system):''}${p.language==='de'?' · Deutsch':''}</div><h2>${esc(p.name)}</h2>
      <p>★ marks the version Quillbound shows first. Copies are listed but never read twice.</p></div>
    ${p.groups.some(g=>g.kind==='book')?`<button class="btn primary" data-act="lib-read" ${I.busy?'disabled':''}>Read this adventure</button>`:''}</div>
    ${I.busy||I.status?`<div class="card readout" style="margin-bottom:12px"><div style="color:var(--${I.busy?'accent':'warn'})">${esc(I.status)}</div></div>`:''}
    <div class="stack">${sections}</div>`;
}
function vResults(){
  const I=S.importer, R=I.result;
  const tabs=[['story','Scenes & leads',R.beats.length+R.hooks.length],['npcs','People',R.npcs.length],['enemies','Enemies',R.enemies.length],['places','Places & maps',R.locations.length+(R.libraryMaps||[]).length],['items','Items',R.items.length],['tables','Roll tables',R.tables.length]];
  const kinds=['beats','hooks','npcs','enemies','locations','libraryMaps','items','tables'];
  const sel=kinds.reduce((n,k)=>n+(R[k]||[]).filter(x=>x.include!==false).length,0);
  const inc=(k,i,x,label)=>`<label><input type="checkbox" data-bind="importer.result.${k}.${i}.include" data-rerender ${x.include!==false?'checked':''}> ${esc(label)}</label>`;
  const pg=x=>x.page?`<span class="chip">p. ${x.page}</span>`:'';
  const card=(k,i,x,label,inner,side='')=>`<div class="card res ${x.include===false?'out':''}"><div class="res-top">${inc(k,i,x,label)}<span class="row" style="gap:4px">${side}${pg(x)}</span></div>${inner}<details class="why"><summary>Why was this included?</summary>${esc(x.why)}</details></div>`;
  const kv=pairs=>`<dl class="kv">${pairs.filter(p=>p[1]).map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`;
  let body='';
  if(I.view==='story'){
    body=`${R.summary?`<div class="card" style="margin-bottom:12px"><div class="eyebrow">Summary</div><p style="margin-top:4px">${esc(R.summary.slice(0,700))}${R.summary.length>700?'…':''}</p></div>`:''}
    <h4 style="margin-bottom:8px">Scenes, in order</h4><div class="results">${R.beats.map((b,i)=>card('beats',i,b,b.title,`<p class="small">${esc(b.summary)}</p>${kv([['Question',b.question],['Next',b.transition]])}
      ${b.senses&&b.senses.length?`<div class="small muted">${b.senses.map(esc).join('<br>')}</div>`:''}
      ${b.branches.length?`<div class="small"><span class="eyebrow">If the party…</span><ul class="list">${b.branches.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${b.scenes&&b.scenes.length?`<div class="pickrow">${b.scenes.slice(0,8).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}
      ${b.readAloud&&b.readAloud.length?`<details class="small"><summary>Read-aloud text</summary><p class="quote">${esc(b.readAloud[0])}</p></details>`:''}`)).join('')||'<div class="empty">No scenes found.</div>'}</div>
    <h4 style="margin:18px 0 8px">Leads</h4><div class="results">${R.hooks.map((h,i)=>card('hooks',i,h,h.title||firstWords(h.text,8),`<p class="small">${esc(h.text)}</p>`)).join('')||'<div class="empty">No leads found.</div>'}</div>
    ${R.reference&&R.reference.length?`<p class="small muted" style="margin-top:12px">Also in the book (reference, not story): ${R.reference.map(r=>esc(r.title)).join(' · ')}</p>`:''}`;
  } else if(I.view==='npcs'){
    body=`<div class="results">${R.npcs.map((n,i)=>card('npcs',i,n,n.name,`<p class="small muted">${esc(n.role)}${n.alignment?' · '+esc(n.alignment):''}${n.age?' · '+n.age:''}</p>
      ${n.line?`<p class="quote">“${esc(n.line)}”</p>`:''}
      ${kv([['Looks',n.look],['Wants',n.wants],['Secret',n.secret],['Knows',n.knows],['Voice',n.voice],['Gesture',n.manner],['If pressed',n.pressed]])}
      ${n.fields&&n.fields.personality?`<details class="small"><summary>From the book</summary><p>${esc(n.fields.personality.slice(0,600))}</p></details>`:''}`,n.enemyId?'<span class="chip warn">has stats</span>':'')).join('')||'<div class="empty">No people found.</div>'}</div>`;
  } else if(I.view==='enemies'){
    body=`<div class="results">${R.enemies.map((e,i)=>card('enemies',i,e,e.name,e.fromCard&&!e.statsFrom?`<p class="small muted">Stats are on the combat card <b>${esc(e.card)}</b>. The DM is asked for its numbers when the fight starts.</p>`:`<p class="small muted">${esc(e.type)}${e.statsFrom?` · numbers from ${esc(e.statsFrom)}${e.fromCard?`, card <b>${esc(e.card)}</b>`:''}`:''}</p>
      ${kv([['5e',`AC ${e.acNum??e.ac??'?'} · HP ${e.hpMax??e.hp??'?'} · CR ${e.crNum??e.cr??'?'}`],['Attacks',(e.attacks||[]).map(a=>`${a.name} ${fmt(a.bonus)}, ${a.damage}`).join(' · ')||'None read. The DM is asked when the fight starts.'],['Breaks',e.breaking],['Moves',e.moves.join(', ')]])}`,`${e.npc?'<span class="chip acc">Also in People</span>':''}${e.card&&!e.fromCard?'<span class="chip">card</span>':''}`)).join('')||'<div class="empty">No stat blocks found.</div>'}</div>`;
  } else if(I.view==='places'){
    const maps=R.libraryMaps||[];
    body=`${maps.length?`<h4 style="margin-bottom:8px">Maps in the folder</h4><div class="results">${maps.map((m,i)=>card('libraryMaps',i,m,m.name,`<div class="small">${m.variants.map(v=>`<div>${esc(v.variant||'original')}</div>`).join('')}</div>${m.usedIn.length?`<p class="small"><span class="muted">Used in:</span> ${m.usedIn.map(esc).join(', ')}</p>`:''}`)).join('')}</div>`:''}
      <h4 style="margin:18px 0 8px">Numbered areas</h4><div class="results">${R.locations.map((l,i)=>card('locations',i,l,`${l.key}. ${l.name}`,`<p class="small">${esc(l.text)}</p>${l.beat?`<p class="small muted">In: ${esc(l.beat)}</p>`:''}`)).join('')||'<div class="empty">No numbered areas found.</div>'}</div>`;
  } else if(I.view==='items'){
    body=`<div class="results">${R.items.map((x,i)=>card('items',i,x,x.name,`<p class="small">${esc((x.desc||'').slice(0,240))}</p>${x.where?`<p class="small muted">In: ${esc(x.where)}</p>`:''}`,x.rarity?`<span class="chip gold">${esc(x.rarity)}</span>`:x.gp?`<span class="chip gold">${esc(x.gp)} gp</span>`:'')).join('')||'<div class="empty">No items found.</div>'}</div>`;
  } else {
    body=`<div class="results">${R.tables.map((t,i)=>card('tables',i,t,t.title,`<table class="rt"><tbody>${t.rows.slice(0,12).map(r=>`<tr><td class="mono">${esc(r.roll)}</td><td>${esc(r.text)}</td></tr>`).join('')}</tbody></table>${t.rows.length>12?`<p class="small muted">+${t.rows.length-12} more rows</p>`:''}`,`<span class="chip">${esc(t.die)}</span>`)).join('')||'<div class="empty">No roll tables found.</div>'}</div>`;
  }
  return `<div class="pagehead"><div><button class="btn sm ghost" data-act="res-back">← ${esc(R.product||'Library')}</button><div class="eyebrow" style="margin-top:8px">Read offline from ${esc(R.source||'the book')} · ${R.stats.pages} pages${R.system?' · '+(SYS_LABEL[R.system]||R.system):''}${R.language==='de'?' · Deutsch':''}</div>
    <h2>${esc(R.title||R.product)}</h2><p>Untick anything the reader got wrong. Page numbers point to the PDF, so you can check.${R.stats.fixes.length?' Repaired while reading: '+esc(R.stats.fixes.join(', '))+'.':''}</p></div></div>
    <div class="rtabs" role="tablist">${tabs.map(([k,l,n])=>`<button class="rtab" role="tab" data-act="res-view" data-v="${k}" aria-selected="${I.view===k}">${l} <span class="n">${n}</span></button>`).join('')}</div>
    ${body}
    <div class="send"><span class="small"><b>${sel}</b> entries selected</span><button class="btn primary" data-act="res-send" ${sel?'':'disabled'}>Send ${sel} to the DM desk</button></div>`;
}
const firstWords=(t,n)=>{const w=(t||'').split(/\s+/); return w.slice(0,n).join(' ')+(w.length>n?'…':'');};

/* ---------- views: DM desk ---------- */
/* ---------- views: campaign planner ---------- */
const THEME_LABEL={undead:'Undead',demons:'Demons & fiends',cult:'Cults',sea:'Sea & ships',wilds:'Wilderness',underground:'Underground',city:'Town & city',fey:'Fey',eldritch:'Eldritch',dragons:'Dragons',carnival:'Carnival & stage',cold:'Ice & snow',fire:'Fire',time:'Time'};
function campaign(){ S.campaign=S.campaign||{order:[],bridges:[]}; return S.campaign; }
const deskToggle=()=>`<div class="seg2" role="tablist"><button class="rtab" data-act="desk-view" data-v="session" aria-selected="${S.deskView!=='campaign'}">This session</button><button class="rtab" data-act="desk-view" data-v="campaign" aria-selected="${S.deskView==='campaign'}">Link adventures</button></div>`;
const lvlText=l=>l?(l.min===l.max?`Level ${l.min}`:`Levels ${l.min}–${l.max}`):'Level unknown';
const themeChips=p=>Object.entries(p.themes||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>`<span class="chip">${THEME_LABEL[k]||k}</span>`).join('');
function vCampaign(){
  const C=campaign(), all=S.adventures||[];
  const head=`<div class="pagehead"><div><div class="eyebrow">DM desk · Campaign</div><h2>Campaign planner</h2><p>Put adventures in order, see where the levels jump, and use the threads the books already share to tie them together. Everything here is a suggestion; you decide.</p></div>${deskToggle()}</div>`;
  if(!all.length) return head+`<div class="card stack" style="max-width:640px"><h3>No adventures read yet</h3><p>Go to <b>Import adventure</b>, drop your folders, and click <b>Read all adventures for a campaign</b>. Each book you read shows up here.</p><div><button class="btn primary" data-act="tab" data-v="import">Go to Import adventure</button></div></div>`;
  if(!window.QB) return head+'<div class="empty">Loading the planner…</div>';
  const advs=C.order.map(id=>all.find(a=>a.id===id)).filter(Boolean);
  const profiles=advs.map(a=>a.profile);
  const links=advs.length>1?QB.findConnections(profiles):[];
  const pick=all.map(a=>{const on=C.order.includes(a.id);return `<div class="advrow"><button class="chip" data-act="camp-toggle" data-id="${a.id}" aria-pressed="${on}">${on?'In campaign':'Add'}</button>
    <div style="min-width:0"><b>${esc(a.product)}</b><div class="small muted">${lvlText(a.profile.levels)}</div><div class="pickrow" style="margin-top:3px">${themeChips(a.profile)}</div></div>
    <button class="btn sm ghost" data-act="camp-forget" data-id="${a.id}" title="Remove from the planner" aria-label="Remove ${esc(a.product)} from the planner">✕</button></div>`;}).join('');
  const bar=l=>{ if(!l) return '<div class="lvlbar unknown"><span>?</span></div>'; return `<div class="lvlbar" title="${lvlText(l)}">${Array.from({length:20},(_,i)=>`<i class="${i+1>=l.min&&i+1<=l.max?'on':''}"></i>`).join('')}</div>`; };
  const linkHtml=(l,A,B)=>`<div class="thread"><div class="row" style="gap:6px"><span class="chip ${l.type==='artifact'?'gold':l.type==='villain'?'bad':l.type==='theme'?'':'acc'}">${{artifact:'Artifact',villain:'Villain',character:'Character',name:'Shared name',theme:'Theme'}[l.type]}</span><b>${esc(l.type==='theme'?l.themes.map(t=>THEME_LABEL[t]||t).join(', '):l.name)}</b></div>
    ${l.ctxA?`<p class="small"><span class="muted">${esc(A.product)}:</span> “${esc(l.ctxA)}”</p>`:''}${l.ctxB?`<p class="small"><span class="muted">${esc(B.product)}:</span> “${esc(l.ctxB)}”</p>`:''}</div>`;
  const ideaBtns=(ideas,A,B)=>ideas.map(t=>{const used=C.bridges.some(b=>b.text===t);return `<div class="idea"><span>${esc(t)}</span><button class="btn sm ${used?'':'primary'}" data-act="camp-bridge" data-from="${A.id}" data-to="${B.id}" data-text="${esc(t)}" ${used?'disabled':''}>${used?'Added':'Use this link'}</button></div>`;}).join('');
  let arc='';
  advs.forEach((a,k)=>{
    arc+=`<div class="arcstep"><div class="arcnum mono">${k+1}</div><div style="min-width:0"><div class="row" style="justify-content:space-between"><b>${esc(a.product)}</b><span class="row" style="gap:4px"><button class="btn sm ghost" data-act="camp-move" data-id="${a.id}" data-v="-1" ${k?'':'disabled'} aria-label="Move up">↑</button><button class="btn sm ghost" data-act="camp-move" data-id="${a.id}" data-v="1" ${k<advs.length-1?'':'disabled'} aria-label="Move down">↓</button></span></div>
      <div class="row small muted">${lvlText(a.profile.levels)} ${themeChips(a.profile)}</div>${bar(a.profile.levels)}
      ${a.villains&&a.villains.length?`<div class="small"><span class="muted">Villains:</span> ${a.villains.slice(0,3).map(esc).join(', ')}</div>`:''}</div></div>`;
    const b=advs[k+1]; if(!b) return;
    const L1=a.profile.levels, L2=b.profile.levels;
    const gap=L1&&L2?(L2.min-L1.max>1?`The party needs to gain ${L2.min-L1.max-1} level${L2.min-L1.max-1>1?'s':''} between these. Add a side adventure, or level them up between sessions.`:L2.max<L1.min?'This one is for lower levels than the one before. Scale its enemies up, or swap the order.':''):'';
    const direct=links.filter(l=>(l.a===k&&l.b===k+1)||(l.a===k+1&&l.b===k));
    const shown=direct.filter(l=>l.type!=='theme').slice(0,3), theme=direct.find(l=>l.type==='theme');
    const lead=shown[0]||(theme?{...theme,name:theme.themes.map(t=>(THEME_LABEL[t]||t).toLowerCase()).join(' and ')}:{type:'none',name:''});
    const ideas=QB.bridgeIdeas(lead,{...a.profile,title:a.product},{...b.profile,title:b.product});
    arc+=`<div class="bridge">${gap?`<p class="small" style="color:var(--warn)">⚠ ${esc(gap)}</p>`:''}
      ${shown.length||theme?`<div class="eyebrow">What these two already share</div>${[...shown,...(theme?[theme]:[])].map(l=>linkHtml(l,l.a===k?a:b,l.a===k?b:a)).join('')}`:'<p class="small muted">No shared names or themes found. Here are ways to connect them anyway.</p>'}
      <div class="eyebrow" style="margin-top:6px">Bridge ideas</div>${ideaBtns(ideas,a,b)}</div>`;
  });
  const far=links.filter(l=>l.type!=='theme'&&Math.abs(l.a-l.b)>1);

/* ---------- starting a fight ---------- */
// Three or more of one creature fight as a group: one card, each member keeps its own HP, the group breaks at half down.
function startCombat(s,enc){
  const foes=[];
  enc.foes.forEach(f=>{const b=s.bestiary.find(x=>x.id===f.ref); if(!b) return; const group=f.n>=3?uid('g'):undefined;
    for(let i=0;i<f.n;i++) foes.push({id:uid('f'),name:b.name+(f.n>1?' '+(i+1):''),type:b.type,tier:b.tier,breaking:b.breaking,goal:b.goal,moves:b.moves,...hpFields(b),ref:b.id,group,groupName:group?b.name:undefined,status:'fighting'});
  });
  s.combat={enc:enc.id,name:enc.name,where:enc.where,goal:enc.goal,foes,round:1,log:[{kind:'scene',text:`The fight begins: ${enc.name}. No initiative roll: the DM chooses who acts first.`}]};
  Stakes.init(s);
  return s.combat;
}

// End of a fight: loose ends (who fled, surrendered or made a deal) can become leads on the DM desk.
function endFightDialog(leads){
  const C=S.combat;
  const dlg=openDialog(`How did ${C.name} end?`,`<div class="stack small">${leads.length?`<div><div class="eyebrow" style="margin-bottom:6px">New leads from this fight</div>${leads.map((h,i)=>`<label class="row" style="flex-wrap:nowrap;align-items:baseline;margin-bottom:4px"><input type="checkbox" id="end-lead-${i}" checked> ${esc(h)}</label>`).join('')}</div>`:'<p class="muted">Nobody escaped, surrendered or made a deal, so there are no loose ends.</p>'}
    <p>Hit points, stamina and conditions stay as they are. Rest afterwards: a short rest spends Hit Dice to heal, a long rest restores everything.${S.party.some(p=>p.hpNow<=0&&!p.dead)?' Heroes still at 0 HP stay unconscious until they are healed.':''}</p></div>
    <div class="row"><button class="btn primary" id="end-confirm">Back to roleplay</button><button class="btn" id="end-cancel">Keep fighting</button></div>`);
  dlg.querySelector('#end-cancel').onclick=()=>dlg.close();
  dlg.querySelector('#end-confirm').onclick=()=>{
    leads.forEach((h,i)=>{ if(dlg.querySelector('#end-lead-'+i).checked) S.hooks.unshift({id:uid('h'),text:h,status:'dangling',clock:0,source:'Fight'}); });
    S.combat=null; S.tab='desk'; S.deskView='session'; dlg.close(); render(); toast('Fight ended. New leads are on the DM desk.');
  };
}

/* ---------- importer glue (the heavy lifting is in src/app/library-session.js) ---------- */
async function libRun(label,job){
  const I=S.importer;
  if(!window.QB){ I.status='The importer is still loading. Try again in a moment.'; render(); return; }
  I.busy=true; I.status=label; render();
  // progress messages arrive fast; repaint at most every 150 ms
  let last=0; const progress=msg=>{ I.status=msg; const now=Date.now(); if(now-last>150){ last=now; render(); } };
  try{ await job(progress); I.status=''; }
  catch(e){ console.error(e); I.status=e.message||String(e); }
  I.busy=false; render();
}
const libAddFiles=files=>libRun('Looking through the files…',async()=>{ S.importer.lib=await QB.addFileList([...files]); S.importer.phase='library'; });
const libAddDrop=dt=>libRun('Looking through the files…',async()=>{ S.importer.lib=await QB.addDropped(dt); S.importer.phase='library'; });
const libCompare=gi=>libRun('Comparing the book versions by their text…',async()=>{ S.importer.versions[S.importer.pi+':'+gi]=await QB.compareVersions(S.importer.pi,gi); });
const libRead=()=>libRun('Loading the PDF reader…',async progress=>{
  const r=await QB.readProduct(S.importer.pi,progress);
  for(const k of ['beats','hooks','npcs','enemies','locations','items','tables','libraryMaps']) (r[k]||[]).forEach(x=>{ if(x.include===undefined) x.include=true; });
  r.items.forEach(x=>{ if(x.mention) x.include=false; });       // passing mentions start unticked
  r.enemies.forEach(x=>{ if(x.fromCard) x.include=true; });
  S.importer.result=r; S.importer.phase='results'; S.importer.view='story';
  rememberAdventure(r);
  if(r.stats.paragraphs<5) S.importer.status='Almost no text found. This PDF may be scanned pages, which the offline reader cannot read.';
});
// Every adventure that has been read is kept (as a small profile) for the campaign planner.
function rememberAdventure(r){
  S.adventures=S.adventures||[];
  const a={id:'adv-'+r.product.toLowerCase().replace(/[^a-z0-9]+/g,'-'),product:r.product,title:r.title||r.product,source:r.source,profile:{...r.profile,title:r.product},
    beats:r.beats.map(b=>b.title),npcs:r.npcs.map(n=>n.name),villains:r.profile.villains,loose:r.hooks.map(h=>h.title||h.text).slice(0,6)};
  const i=S.adventures.findIndex(x=>x.id===a.id);
  if(i>=0) S.adventures[i]=a; else S.adventures.push(a);
}
const libReadAll=()=>libRun('Reading all adventures…',async progress=>{
  const ps=S.importer.lib.products.filter(p=>p.type==='adventure');
  let n=0, failed=[];
  for(const p of ps){
    n++;
    try{ rememberAdventure(await QB.readProduct(p.i,msg=>progress(`Book ${n} of ${ps.length}, ${p.name}: ${msg}`))); }
    catch(e){ failed.push(p.name); }
  }
  toast(`Read ${ps.length-failed.length} adventures. Open the DM desk → Campaign to connect them.`);
  if(failed.length) S.importer.status='Could not read: '+failed.join(', ');
});
async function libPreview(path){
  try{ const url=await QB.previewUrl(S.importer.pi,path), name=path.split('/').pop(); openDialog(name,`<img src="${esc(url)}" alt="${esc(name)}" class="preview">`,{wide:true}); }
  catch(e){ toast(e.message); }
}

// Reader output → DM desk records
function sendReaderResult(s,R){
  let n=0;
  const on=x=>x.include!==false;
  const add=(arr,item,key='name')=>{ if(arr.some(x=>(x[key]||'').toLowerCase()===(item[key]||'').toLowerCase())) return; arr.push(item); n++; };

  R.npcs.filter(on).forEach(x=>add(s.npcs,{id:x.id,name:x.name,role:x.role,wants:x.wants,fears:(x.fields&&x.fields.fear)||'',secret:x.secret,voice:x.voice,manner:x.manner,pressed:x.pressed,look:x.look,line:x.line,knows:x.knows,page:x.page,open:false}));
  R.enemies.filter(on).forEach(e=>add(s.bestiary,{id:e.id,name:e.name,type:e.type,ac:e.ac,hp:e.hp,cr:e.cr,tier:e.tier,slots:e.slots,breakAt:e.breakAt,breaking:e.breaking,goal:e.goal,moves:e.moves,card:e.card||'',...hpFields(e)}));
  const areasByBeat={};
  R.locations.filter(on).forEach(l=>{ (areasByBeat[l.beat||'Other areas']=areasByBeat[l.beat||'Other areas']||[]).push({key:l.key,name:l.name,text:l.text}); });
  (R.libraryMaps||[]).filter(on).forEach(m=>{ const areas=m.usedIn.flatMap(b=>areasByBeat[b]||[]); add(s.maps,{id:m.id,name:m.name,areas,variants:m.variants.map(v=>v.variant||'original'),usedIn:m.usedIn}); });
  for(const [beat,areas] of Object.entries(areasByBeat)) if(!s.maps.some(m=>m.areas.some(a=>areas.includes(a)))) add(s.maps,{id:uid('m'),name:beat,areas,variants:[],usedIn:[beat]});
  R.items.filter(on).forEach(x=>add(s.items,{id:x.id,name:x.name,desc:x.desc,rarity:x.rarity||(x.gp?x.gp+' gp':'')}));
  s.tables=s.tables||[];
  R.tables.filter(on).forEach(t=>add(s.tables,{id:t.id,title:t.title,die:t.die,rows:t.rows,last:''},'title'));
  return n;
}

const BAND_LABEL={crit:'NATURAL 20!',success:'Success',mixed:'Success with a consequence',setback:'Setback',disaster:'NATURAL 1!'};

// Keep the draft valid: a character who can act, a fitting target, and the sheet's ability for the action.
function combatSettle(){
  const l=Stakes.init(S); if(!l||l.pending) return; const d=l.draft;
  if(!Stakes.active(S,Stakes.actor(S,d.actor))){ const a=S.party.find(p=>Stakes.active(S,p)); if(a){ d.actor=a.id; d.mode='hero'; } }

function combatPick(id){ const l=Stakes.init(S); if(l.pending) return; const a=Stakes.actor(S,id); if(!a) return;

function combatRun(fn){ const l=S.combat?.lite; if(l) l.uiError=''; try{ return fn(); }catch(e){ if(l) l.uiError=e.message; toast(e.message); } }

function combatRoll(manual){ combatRun(()=>{ combatSettle(); const l=Stakes.init(S), d=l.draft;

// A group of three or more of one creature: one card, a row and an HP bar per member.

// Tokens in an area: heroes and single enemies as tokens, each group as one card.
function zoneTokens(list){ const seen=new Set(); return list.map(a=>{ if(!a.group) return combatToken(a); if(seen.has(a.group)) return ''; seen.add(a.group); return groupCard(list.filter(f=>f.group===a.group)); }).join(''); }

function combatComposer(){

const ATTACK_LABEL={crit:'Critical hit: damage dice double',success:'Hit',mixed:'Graze: half damage',setback:'Miss',disaster:'Natural 1: miss'};

    const dmg=dealsDamage&&lands?`<div class="row lt-dmg"><label class="f">Damage${r.band==='crit'?' (dice doubled)':''}${r.band==='mixed'&&attack?' (the target takes half)':''}<input type="number" min="0" max="999" step="1" data-bind="combat.lite.pending.rolls.${i}.damage" value="${r.damage??''}" placeholder="${esc(r.expr)}"></label><button class="btn sm" data-act="lt-dmg" data-i="${i}">Reroll damage</button><span class="small muted">Auto-rolled damage; edit for table dice.</span></div>`:'';
    const strike=attack&&responseIndex===i?`<div class="lt-strike"><label><input type="checkbox" data-bind="combat.lite.pending.rolls.${i}.strike.reach" data-rerender ${r.strike.reach?'checked':''}> ${esc(t?.name||'The target')} can reach and strikes back with ${esc(r.strike.name)}</label>${r.strike.reach?`<label class="f">Strike-back damage${r.band==='disaster'?' (critical)':''}<input type="number" min="0" max="999" step="1" data-bind="combat.lite.pending.rolls.${i}.strike.damage" value="${r.strike.damage}"></label>`:''}</div>`:'';
    const hit=enemy&&p.enemyEffect==='damage'&&!['crit','success'].includes(r.band)?`<label class="f">Damage to ${esc(t?.name||'the hero')}${r.band==='disaster'?' (critical)':''}<input type="number" min="0" max="999" step="1" data-bind="combat.lite.pending.rolls.${i}.damage" value="${r.damage}"></label>`:'';
    return `<div class="lt-rollrow ${r.band}">${head}${dmg}${strike}${hit}${push}</div></div>`;
  }).join('');
  const bad=['mixed','setback','disaster'].includes(p.band), disaster=attack&&responseIndex>=0?p.rolls[responseIndex].band==='disaster':p.band==='disaster';
  const unreachable=attack&&responseIndex>=0&&!p.rolls[responseIndex].strike.reach;
  const foes=S.combat.foes.filter(f=>Stakes.active(S,f)&&!Stakes.needs(S,f).length);
  const consequences=(!enemy&&!attack&&bad)||unreachable?`<div class="lt-consequences"><label class="f">${disaster?'Choose a major reversal':'Choose the consequence'}<select data-bind="combat.lite.pending.consequence" data-rerender>
      <option value="position" ${p.consequence==='position'?'selected':''}>${disaster?'Separated and pinned in open ground':'Lose position and become Exposed'}</option>
      ${!attack&&foes.length?`<option value="strike" ${p.consequence==='strike'?'selected':''}>${disaster?'An enemy lands a critical strike':'An enemy strikes'}</option>`:''}
      <option value="goal" ${p.consequence==='goal'?'selected':''}>${disaster?'The enemy achieves a major goal':p.stakes?'What was at risk happens':'The scene changes against you'}</option></select></label>
    ${p.consequence==='goal'?`<label class="f">What changes?<textarea data-bind="combat.lite.pending.consequenceText" rows="2">${esc(p.consequenceText)}</textarea></label>`:''}
    ${p.consequence==='strike'&&!attack?`<label class="f">Which enemy?<select data-bind="combat.lite.pending.striker">${foes.map(f=>`<option value="${esc(f.id)}" ${p.striker===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label class="f">Damage (leave empty to roll its attack)<input type="number" min="0" max="999" step="1" data-bind="combat.lite.pending.strikeDamage" value="${p.strikeDamage??''}"></label>`:''}</div>`:'';
  const crit=p.rolls.some(r=>r.band==='crit')&&!dealsDamage;
  const reward=crit?`<div class="lt-reward"><label class="f">Choose your extra benefit<select data-bind="combat.lite.pending.reward" data-rerender><option value="opening" ${p.reward==='opening'?'selected':''}>Give a hero an opening</option><option value="protect" ${p.reward==='protect'?'selected':''}>Cover a hero (opening on their next defense)</option><option value="move" ${p.reward==='move'?'selected':''}>Seize better ground</option></select></label>
    ${['opening','protect'].includes(p.reward)?`<label class="f">Who benefits?<select data-bind="combat.lite.pending.rewardTarget">${S.party.filter(h=>Stakes.active(S,h)).map(h=>`<option value="${esc(h.id)}" ${p.rewardTarget===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label>`:p.reward==='move'?zoneSelect('combat.lite.pending.destination',p.destination):''}</div>`:'';
  const effect=enemy?(p.enemyEffect!=='damage'?`If the defense fails: ${p.enemyOutcome}`:`${a.name} attacks ${t?.name}.`)
    :attack?`${a.name} attacks ${t?.name}.`:['crit','success','mixed'].includes(p.band)?(p.action==='defend'?`${t?.name} is covered: an opening on their next defense roll.`:p.action==='help'?`Give ${t?.name} an opening.`:p.action==='move'?`Reach ${l.zones[p.destination]}.`:p.intent):'Your intent does not land. The opposition changes the situation.';
  return `<section class="lt-result ${p.band}" aria-live="polite"><div class="eyebrow">2 · Resolve the roll</div><p class="lt-intent">${esc(effect)}</p>
    ${p.stakes&&!enemy?`<p class="small"><b>At risk:</b> ${esc(p.stakes)}</p>`:''}
    <div class="lt-rolls">${rows}</div>
    ${consequences}${reward}${Stakes.contextPreview(p)?`<p><b>Automatic condition:</b> ${esc(Stakes.contextPreview(p).add||'Clear '+Stakes.contextPreview(p).remove.join(' / '))}. ${esc(Stakes.contextPreview(p).reason)}</p>`:''}${!enemy&&p.action==='move'&&p.destination==='cover'&&['crit','success','mixed'].includes(p.band)&&l.conditions[p.actor].includes('Exposed')?`<label><input type="checkbox" data-bind="combat.lite.pending.clearExposure" ${p.clearExposure?'checked':''}> DM judgment: this cover provides safety; clear Exposed if the character remains here after consequences.</label>`:''}
    ${p.cost.stamina||p.cost.hd?`<p class="small">On confirm, ${esc(a.name)} spends ${[p.cost.stamina&&p.cost.stamina+' stamina',p.cost.hd&&p.cost.hd+' Hit Die'].filter(Boolean).join(' and ')}.</p>`:''}
    <div class="row"><button class="btn primary" data-act="lt-confirm">Confirm result</button><button class="btn ghost" data-act="lt-cancel">Cancel roll</button></div><p class="small muted">Nothing changes until you confirm, and a cancelled push costs nothing. Undo can reverse a confirmed result.</p></section>`;
}

function vCombat(){

  combatSettle();

    <div class="row"><button class="btn" data-act="lt-undo" ${l.history.length?'':'disabled'}>↶ Undo</button><button class="btn" data-act="lt-round" ${l.pending?'disabled':''}>Next round</button><button class="btn ghost" data-act="c-end">End fight</button></div></div>
  <div class="row hd-controls"><button class="btn sm" data-act="hd-guide">Conditions guide</button><button class="btn sm" data-act="hd-secret">DM secret roll</button></div>
  <div class="lt-layout"><div class="lt-stage">
    <div class="lt-scenehead"><span class="eyebrow">The scene · ${esc(c.where||'')}</span><button class="btn sm ghost" data-act="lt-zones" ${l.pending?'disabled':''}>Name areas</button></div>
    <div class="lt-board">${Stakes.zones.map(z=>`<section class="lt-zone" data-zone="${z}" aria-label="${esc(l.zones[z])}"><h3>${esc(l.zones[z])}</h3><div class="lt-zone-body">${zoneTokens(actors.filter(a=>l.positions[a.id]===z))||'<p class="small muted">Drop a token here</p>'}</div></section>`).join('')}</div>
    <p class="lt-boardhint">Drag tokens to arrange the scene. Or use <b>Place selected token</b> below. Free placement is a DM adjustment; choose Move for a risky action.</p>
    <div class="lt-placement"><span class="small">Place selected token:</span>${Stakes.zones.map(z=>`<button class="btn sm" data-act="lt-place" data-v="${z}" ${l.pending?'disabled':''}>${esc(l.zones[z])}</button>`).join('')}</div>

    <details class="lt-rules"><summary>The rules in one minute</summary>
      <p>Say what you do, and what's at risk if it goes wrong. Then roll a d20. A natural 20 and a natural 1 always count.</p>
      <p><b>Attack:</b> d20 + your attack bonus against the target’s armor class. Reach it and you hit for your normal damage. Miss by 5 or less and it’s a graze: half damage. The first eligible graze or miss while the enemy is standing may trigger one strike-back for the whole Attack action, unless it can't reach you. Extra Attack means one roll per attack.</p>
      <p><b>Defending:</b> when an enemy acts, the hero rolls d20 + armor class − 10 and must beat 11 + the enemy’s attack bonus. These are exactly 5e’s chances. Damage comes from the stat block.</p>
      <p><b>Stamina:</b> after seeing your own roll, spend 1 stamina to add 1d4. Stamina equals your proficiency bonus and comes back on a long rest. When it runs out you are Winded and can still push by spending a Hit Die instead.</p>
      <p><b>Other actions</b> (Help, Defend, Move, Improvise): 15+ succeeds, 8–14 succeeds with a consequence, 7 or less is a setback. Defend gives an ally an opening on their next defense roll; Help gives an opening on their next roll.</p>
      <p><b>Hit points:</b> at 0 HP a hero is dying and makes death saves; an enemy is out. Enemies waver at their breaking point (15–30% of their HP, tougher ones hold out longer; a group when half of it is down) and the DM decides whether they flee, surrender, make a deal or fight on.</p>
      <p>Conditions change what is possible. Resolve a condition with × when the story allows it. Spell slots and limited features stay on your sheet; Stakes is still being playtested and is not a complete conversion of every 5e feature.</p></details>

  <datalist id="lt-conditions">${['Disarmed','Pinned','Exposed','Distracted','Hidden','Separated','Spell interrupted'].map(x=>`<option value="${x}">`).join('')}</datalist>`;
}

/* ---------- player screen integration ---------- */
/* DM controls. The player feed contains explicit public fields only. */
let playerSpotlight = null;
let playerChannel = null;
let playerLastPayload = '';
function playerSettings() {
  if (!S.playerSettings) S.playerSettings = { token: '', party: false, combat: false };
  if (!/^[a-f0-9]{32}$/.test(S.playerSettings.token)) S.playerSettings.token = Array.from(crypto.getRandomValues(new Uint8Array(16)), x => x.toString(16).padStart(2,'0')).join('');
  return S.playerSettings;
}
function playerConnect() {
  const cfg = playerSettings();
  if (!window.BroadcastChannel || playerChannel?.token === cfg.token) return;
  playerChannel?.channel.close();
  const channel = new BroadcastChannel('quillbound-player-' + cfg.token);
  playerChannel = { channel, token: cfg.token };
  channel.onmessage = e => { if (e.data?.type === 'hello') publishPlayer(true); };
}
function publishPlayer(force = false) {
  playerConnect();
  const data = PlayerFeed.snapshot(S, playerSpotlight);
  // Ignore the timestamp when comparing so typing private notes sends nothing new.
  const key = JSON.stringify({ ...data, updated: 0 });
  if (force || key !== playerLastPayload) { playerLastPayload = key; playerChannel?.channel.postMessage({ type: 'snapshot', payload: data }); }
}
function eye(kind, record) {

function playerEdit(kind, id) {

async function playerMap(path) {
  try {
    if(!window.QB) throw new Error('The importer is still loading. Try again in a moment.');
    const image = await QB.blobFor(S.importer.pi,path);
    const url = await QB.previewUrl(S.importer.pi,path);
    const dlg=openDialog(image.dm?'Review DM map before showing':'Review map or handout', `${image.dm?'<p><b>This is labeled as a DM version. Its labels and secrets will be visible.</b></p>':'<p>Check this image for labels or secrets before showing it.</p>'}<img alt="Preview before revealing" src="${esc(url)}" style="max-width:100%;max-height:45vh;object-fit:contain"><label class="f">Player-facing title<input id="map-title" value="Map or handout" maxlength="200"></label><button class="btn primary" id="map-confirm">Show this image to players</button>`);
    dlg.querySelector('#map-confirm').onclick=async e=>{
      e.target.disabled=true;
      try {
        // Re-encode pixels: a bounded PNG contains no filename, PDF or image metadata.
        const bitmap=await createImageBitmap(image.blob); const scale=Math.min(1,2400/Math.max(bitmap.width,bitmap.height));
        const canvas=document.createElement('canvas'); canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
        canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height); bitmap.close();
        playerSpotlight={type:'image',title:dlg.querySelector('#map-title').value,url:canvas.toDataURL('image/png')};publishPlayer(true);dlg.close();toast('Image shown on player screen');
      }catch(error){e.target.disabled=false;toast('Could not display this image: '+error.message);}
    };
  }catch(error){toast(error.message);}
}

ounterDesign.eligible(S,c).map(p=>`<div><b>${esc(p.name)}</b> · passive ${p.passive}${p.layers.length?'': ' · notices no prepared layer'}${c.layers.map((layer,i)=>p.layers.includes(layer)?`<p>${esc(layer.text)} <button class="btn sm" data-act="rd-discover" data-id="${esc(c.id)}" data-hero="${esc(p.id)}" data-index="${i}" ${d.discoveries.some(x=>x.clue===c.id&&x.hero===p.id&&x.layer===i)?'disabled':''}>Record discovery</button></p>`:'').join('')}</div>`).join('')}</article>`).join('')||'<p>No clues yet. Add observable details without stating the secret behind them.</p>'}${d.discoveries.map(x=>`<p><b>${esc(x.heroName)}</b>: ${esc(x.text)} <button class="btn sm" data-act="rd-share-clue" data-id="${esc(x.id)}">${x.shared?'Hide from common display':'Share on common display'}</button></p>`).join('')}${d.mode!=='simple'?`<h4>Goal clocks</h4><button class="btn sm" data-act="rd-clock-add">Add clock</button>${d.clocks.map(k=>`<article class="card"><b>${esc(k.name)} · ${k.filled}/${k.size}</b><p>${esc(k.outcome)}</p><div class="row"><button class="btn sm" data-act="rd-clock" data-id="${esc(k.id)}" data-delta="-1">−</button><button class="btn sm" data-act="rd-clock" data-id="${esc(k.id)}" data-delta="1">+</button><button class="btn sm" data-act="rd-clock-share" data-id="${esc(k.id)}">${k.shared?'Hide clock':'Share reviewed clock title'}</button></div></article>`).join('')}`:''}${d.mode==='boss'?`<h4>Phase reminders</h4><button class="btn sm" data-act="rd-phase-add">Add phase</button>${d.phases.map(p=>`<article class="card"><b>${esc(p.name)}</b><p>Trigger: ${esc(p.when)}</p><p>Change: ${esc(p.change)}</p><button class="btn sm" data-act="rd-phase" data-id="${esc(p.id)}" ${p.triggered?'disabled':''}>${p.triggered?'Triggered':'Trigger phase & record change'}</button></article>`).join('')}`:''}</section>`;};
function rdBusy(){if(S.combat?.lite?.pending){toast('Confirm or cancel the current roll first.');return true;}return false;}
function rdDialog(title,body,run){const dlg=openDialog(title,body+'<div class="row"><button class="btn primary" id="rd-save">Save</button><button class="btn" id="rd-cancel">Cancel</button></div>');dlg.querySelector('#rd-cancel').onclick=()=>dlg.close();dlg.querySelector('#rd-save').onclick=()=>{try{run(dlg);dlg.close();render();}catch(e){toast(e.message);}};return dlg;}
function rdValue(d,id){return d.querySelector('#'+id).value.trim();}
function rdField(id,title,value='',type='input'){return `<label class="f">${esc(title)}${type==='textarea'?`<textarea id="${id}" rows="3">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}">`}</label>`;}
Object.assign(ACT,{
 'rd-group':()=>{if(rdBusy())return;rdDialog('Group matching enemies','<p>Three or more matching, unhurt enemies in the same area become one group card. Each keeps its own hit points, and the group breaks when half of it is down. Use Undo to separate them again.</p>',()=>EncounterDesign.groupMinions(S));},
 'rd-sheets':()=>{const dlg=openDialog('Awareness & subclass sheets',`<p>Perception bonus includes Wisdom, skill proficiency or expertise, and other applicable modifiers. Blank uses Wisdom only. This is separate from the tracker’s ability training.</p>${S.party.map(p=>`<article class="card"><h4>${esc(p.name)} · ${esc(p.cls)}</h4><button class="btn sm" data-act="rd-sheet" data-id="${esc(p.id)}">Edit sheet</button><p>Passive Perception ${EncounterDesign.passive(p)}${p.perceptionBonus===undefined?' · Wisdom only, check skill proficiency':''}</p><p>${esc(p.subclass?.name||'No subclass attached')}</p>${(p.subclass?.features||[]).map((f,i)=>`<details><summary>${esc(f.name)}${f.level?' · level '+f.level:''}${f.level>p.level?' · not yet available':''}</summary><p>${esc(f.text)}</p><p class="small muted">${esc(p.subclass.source)} · PDF page ${f.page} · manual resolution</p><button class="btn sm" data-act="rd-feature-use" data-id="${esc(p.id)}" data-index="${i}" ${f.level>p.level?'disabled':''}>Record use (${Number(p.featureUses?.[i])||0})</button></details>`).join('')}</article>`).join('')}<button class="btn sm" data-act="rd-feature-reset">Reset feature use reminders after a rest</button><p class="small muted">Use counts are a manual reminder. Resolve saves, damage, spell slots, reactions and recharge with the DM; importing a feature does not automate or rebalance it.</p>`);},
 'rd-sheet':d=>{const p=pc(d.id);rdDialog('Edit '+p.name,rdField('rd-level','Character level',p.level)+rdField('rd-per','Total Wisdom (Perception) check bonus',p.perceptionBonus??'')+`<label class="f">Perception circumstances<select id="rd-per-state">${['normal','advantage','disadvantage'].map(x=>`<option ${p.perceptionState===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="f">Subclass<select id="rd-option"><option value="">None</option>${(S.characterOptions||[]).filter(o=>o.baseClass===p.cls).map(o=>`<option value="${esc(o.id)}" ${p.subclass?.id===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></label>`,dlg=>{const level=Number(rdValue(dlg,'rd-level')),bonus=rdValue(dlg,'rd-per');if(!Number.isInteger(level)||level<1||level>20||bonus!==''&&(!Number.isInteger(Number(bonus))||Math.abs(Number(bonus))>100))throw Error('Use a level from 1 to 20 and a whole-number Perception bonus.');p.level=level;p.prof=2+Math.floor((level-1)/4);p.perceptionBonus=bonus===''?undefined:Number(bonus);p.perceptionState=rdValue(dlg,'rd-per-state');const option=(S.characterOptions||[]).find(o=>o.id===rdValue(dlg,'rd-option'));if(p.subclass?.id!==option?.id)p.featureUses={};p.subclass=option?JSON.parse(JSON.stringify(option)):null;});},
 'rd-feature-reset':()=>{for(const p of S.party)p.featureUses={};ACT['rd-sheets']();},
 'rd-feature-use':d=>{const p=pc(d.id);p.featureUses??={};p.featureUses[d.index]=(Number(p.featureUses[d.index])||0)+1;ACT['rd-sheets']();},
 'rd-enemy':d=>{if(rdBusy())return;const f=Stakes.actor(S,d.id);rdDialog('Private plan · '+f.name,rdField('rd-public-name','Player-facing name',f.publicName||f.name)+rdField('rd-plan','True intent · DM only',f.privatePlan,'textarea')+rdField('rd-tell','Observable tell · no secret explanation',f.observableTell,'textarea')+`<label><input type="checkbox" id="rd-concealed" ${f.concealed?'checked':''}> Conceal this enemy from the player display</label>`,dlg=>{Stakes.remember(S);f.publicName=rdValue(dlg,'rd-public-name')||'Unknown figure';f.privatePlan=rdValue(dlg,'rd-plan');f.observableTell=rdValue(dlg,'rd-tell');f.concealed=dlg.querySelector('#rd-concealed').checked;});},
 'rd-tell':d=>{const f=Stakes.actor(S,d.id);rdDialog('Review observation for common display',rdField('rd-tell-public','Only this text will be shown',f.observableTell,'textarea'),dlg=>{const text=rdValue(dlg,'rd-tell-public');if(!text)throw Error('Enter an observation.');Stakes.remember(S);EncounterDesign.init(S).discoveries.push({id:uid('notice'),heroName:'The party',text,shared:true});});},
 'rd-clue':d=>{if(rdBusy())return;const design=EncounterDesign.init(S),old=design.clues.find(c=>c.id===d.id),c=old||{id:uid('clue'),title:'',zone:'any',layers:[{dc:10,text:''},{dc:14,text:''},{dc:18,text:''}]};rdDialog('Layered observation',rdField('rd-title','Private clue label',c.title)+`<label class="f">Where can it be noticed?<select id="rd-zone">${['any',...Stakes.zones].map(z=>`<option value="${z}" ${c.zone===z?'selected':''}>${esc(z==='any'?'Any area':S.combat.lite.zones[z])}</option>`).join('')}</select></label>`+[0,1,2].map(i=>rdField('rd-dc-'+i,'Layer '+(i+1)+' · passive threshold',c.layers[i]?.dc??(10+i*4))+rdField('rd-text-'+i,'Observable detail',c.layers[i]?.text||'','textarea')).join(''),dlg=>{const layers=[0,1,2].map(i=>({dc:Number(rdValue(dlg,'rd-dc-'+i)),text:rdValue(dlg,'rd-text-'+i)}));if(layers.some(l=>!Number.isInteger(l.dc)||l.dc<0||l.dc>100)||!rdValue(dlg,'rd-title')||!layers.some(l=>l.text))throw Error('Give the clue a label, at least one detail, and whole-number thresholds from 0 to 100.');Stakes.remember(S);Object.assign(c,{title:rdValue(dlg,'rd-title'),zone:rdValue(dlg,'rd-zone'),layers});if(!old)design.clues.push(c);});},
 'rd-discover':d=>{if(rdBusy())return;combatRun(()=>EncounterDesign.discover(S,d.id,d.hero,Number(d.index)));},
 'rd-share-clue':d=>{if(rdBusy())return;Stakes.remember(S);const x=EncounterDesign.init(S).discoveries.find(x=>x.id===d.id);x.shared=!x.shared;},
 'rd-clock-add':()=>{if(rdBusy())return;rdDialog('Add goal clock',rdField('rd-clock-name','Private goal')+rdField('rd-clock-size','Segments (2–12)',6)+rdField('rd-clock-outcome','What happens when full?','','textarea'),dlg=>{const size=Number(rdValue(dlg,'rd-clock-size'));if(!rdValue(dlg,'rd-clock-name')||!Number.isInteger(size)||size<2||size>12)throw Error('Name the goal and use 2 to 12 segments.');Stakes.remember(S);EncounterDesign.init(S).clocks.push({id:uid('clock'),name:rdValue(dlg,'rd-clock-name'),size,filled:0,outcome:rdValue(dlg,'rd-clock-outcome'),shared:false,publicName:''});});},
 'rd-clock':d=>{if(!rdBusy())EncounterDesign.clock(S,d.id,Number(d.delta));},
 'rd-clock-share':d=>{if(rdBusy())return;const k=EncounterDesign.init(S).clocks.find(k=>k.id===d.id);if(k.shared){Stakes.remember(S);k.shared=false;return;}rdDialog('Review public clock title',rdField('rd-clock-public','Title players will see',k.publicName),dlg=>{if(!rdValue(dlg,'rd-clock-public'))throw Error('Give the public clock a title.');Stakes.remember(S);k.publicName=rdValue(dlg,'rd-clock-public');k.shared=true;});},
 'rd-phase-add':()=>{if(rdBusy())return;rdDialog('Add phase reminder',rdField('rd-phase-name','Phase name')+rdField('rd-phase-when','Trigger')+rdField('rd-phase-change','What changes?','','textarea'),dlg=>{if(!rdValue(dlg,'rd-phase-name')||!rdValue(dlg,'rd-phase-when')||!rdValue(dlg,'rd-phase-change'))throw Error('Describe the phase, its trigger and its change.');Stakes.remember(S);EncounterDesign.init(S).phases.push({id:uid('phase'),name:rdValue(dlg,'rd-phase-name'),when:rdValue(dlg,'rd-phase-when'),change:rdValue(dlg,'rd-phase-change'),triggered:false});});},
 'rd-phase':d=>{if(!rdBusy())EncounterDesign.phase(S,d.id);},
});
const rdStart=startCombat;
startCombat=function(s,enc){const c=rdStart(s,enc);if(enc.playtest){c.design={mode:'standard',clues:[{id:'organ-tell',title:'The performance · original playtest clue',zone:'any',layers:[{dc:10,text:'The performer’s gaze keeps returning to the cart behind her.'},{dc:14,text:'Her hand tightens around the organ handle whenever someone approaches the cart.'},{dc:18,text:'Between flourishes, she watches the space between your feet and the rails.'}]}],discoveries:[],clocks:[{id:'entrance',name:'The performers take control of the entrance',publicName:'The crowd grows uneasy',filled:0,size:4,shared:false,outcome:'The DM changes access to the entrance; resolve the scene together.'}],phases:[{id:'performance-breaks',name:'The performance breaks down',when:'The party openly confronts the performers',change:'Stop the music, change the scene description, and choose their next action.',triggered:false}]};c.foes[0].publicName='Organ-grinder performer';c.foes[1].publicName='Dancing monkey';c.foes[0].privatePlan='Source encounter: Reaver can use the organ grinder to pull characters toward the cart. Resolve the printed spell and scaling manually (adventure PDF p. 7).';c.foes[0].observableTell='The performer’s gaze keeps returning to the cart behind her.';c.foes[1].privatePlan='Feebles is associated with Reaver; keep his nature private until discovered.';}return c;};
const rdReader=sendReaderResult;
sendReaderResult=function(s,r){const n=rdReader(s,r);for(const b of s.bestiary)if((r.enemies||[]).some(e=>e.id===b.id))b.source=r.product;return n;};

const rdAssetSend=sendReaderResult;
sendReaderResult=function(s,r){const n=rdAssetSend(s,r);if(r.sampleAssets)s.sampleAssets=r.sampleAssets;return n;};
const rdAssetDesk=vDesk;
vDesk=function(){return rdAssetDesk()+((S.sampleAssets||[]).length?`<section class="card stack"><h3>Happy Jack’s maps & artwork</h3><p>Supplied artwork stays on this computer. Preview each image before sharing; DM labels can reveal secrets.</p>${S.sampleAssets.map((a,i)=>`<details><summary>${esc(a.title)} · ${esc(a.variant||a.kind)}</summary><img src="${esc(a.path)}" loading="lazy" alt="Private asset preview" style="max-width:100%;max-height:400px;object-fit:contain"><button class="btn sm" data-act="rd-asset" data-index="${i}">Review for player display</button></details>`).join('')}</section>`:'');};
ACT['rd-asset']=async d=>{
 const a=S.sampleAssets?.[Number(d.index)];if(!a||!/^samples\/assets\/happy-\d+\.(jpg|jpeg|png)$/.test(a.path))return;
 const dlg=rdDialog('Review image for player display',`${a.dm?'<p><b>DM version: check labels and secrets.</b></p>':'<p>Check this image for labels and secrets.</p>'}<img src="${esc(a.path)}" alt="Preview before sharing" style="max-width:100%;max-height:45vh;object-fit:contain">`+rdField('rd-asset-title','Player-facing title','Map or handout'),()=>{});
 dlg.querySelector('#rd-save').textContent='Show this image to players';
 dlg.querySelector('#rd-save').onclick=async()=>{try{const res=await fetch(a.path);if(!res.ok)throw Error('Image could not be loaded.');const bitmap=await createImageBitmap(await res.blob()),scale=Math.min(1,2400/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();playerSpotlight={type:'image',title:rdValue(dlg,'rd-asset-title'),url:canvas.toDataURL('image/png')};publishPlayer(true);dlg.close();}catch(e){toast(e.message);}};
};

S=load()||fresh();
// This table's homebrew ships with the app (src/app/table-homebrew.js): add it once per browser, approved, skipping names this browser already has.
// A newer shipped version of an item (its "version") replaces the copy this browser got earlier; approval stays as the DM left it.
(function(){ const T=globalThis.QB_TABLE_HOMEBREW; if(!T) return; const hb=hbState(); hb.seeded??=[]; if(hb.seeded.includes(T.id)) return;
  for(const k of ['backgrounds','species','classes']) for(const x of T[k]||[]){ const copy={...JSON.parse(JSON.stringify(x)),updated:Date.now()}, i=hb[k].findIndex(y=>y.id===x.id);
    if(i>=0){ if((hb[k][i].version||1)<(x.version||1)) hb[k][i]={...copy,approved:hb[k][i].approved}; }
    else if(!hb[k].some(y=>String(y.name).trim().toLowerCase()===x.name.toLowerCase())) hb[k].push(copy); }
  hb.seeded.push(T.id); save(); })();
delete S.modal; // older saves kept the previous popup here

if(S.importer.lib){ S.importer.lib=null; if(S.importer.phase==='product') S.importer.phase='library'; }
render();
