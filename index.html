<style>
/* Layout: a graph-paper "DM's desk". Sticky header with the four tools; each tool is a 2–3 column working surface that stacks on phones. */
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.55rem;font-weight:700;letter-spacing:.01em}
.brand svg{width:26px;height:26px;color:var(--accent)}
.proto{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid currentColor;border-radius:3px;padding:1px 5px;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:2px;flex:1;min-width:0;order:3;flex-basis:100%} /* their own row, wrapping: no tab is ever scrolled out of sight */
.tab{white-space:nowrap}
@media (max-width:640px){ .tabs{order:3;flex-basis:100%} }
.tab{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:5px;cursor:pointer;display:flex;align-items:baseline;gap:7px}
.tab .n{font-family:var(--mono);font-size:.7rem;opacity:.8}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
main{padding-block:22px 56px}

/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{font:inherit;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2;text-align:left}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.discord{border-style:dashed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:58px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
button.chip{cursor:pointer;font-family:inherit}
button.chip:hover{border-color:var(--accent)}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.why{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);text-align:center;font-size:.92rem}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{max-width:62ch;color:var(--muted);margin-top:6px}

/* creator */
.stepper{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;counter-reset:s}
.stepper button{font:inherit;font-size:.9rem;background:none;border:1px solid transparent;border-radius:99px;padding:4px 12px 4px 6px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px}
.stepper button::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:.72rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.stepper button[aria-current="step"]{color:var(--ink);border-color:var(--line);background:var(--surface)}
.stepper button[aria-current="step"]::before{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper button.done::before{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.stepper button:disabled{cursor:default;opacity:.55}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.choice{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice .pitch{font-family:var(--display);font-size:1.18rem;line-height:1.15;font-weight:600}
.choice .meta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.choice .cls{font-weight:700}
.choice .desc{font-size:.9rem;color:var(--muted)}
.cr-foot{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.prompts{display:grid;gap:16px;max-width:760px}
.abil-table{display:grid;gap:6px;max-width:820px}
.abil{font:inherit;color:inherit;display:grid;grid-template-columns:52px 54px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer}
.abil:hover{border-color:var(--accent)}
.abil[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.abil .score{font-family:var(--mono);font-size:1.5rem;font-weight:600;text-align:center}
.abil .mod{font-family:var(--mono);font-size:.95rem;color:var(--accent);font-weight:600}
.abil .what b{display:block}
.abil .what span{font-size:.86rem;color:var(--muted)}
.bar{height:6px;width:90px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.sheet{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.sheet .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:5px;padding:8px;text-align:center;background:var(--surface-2)}
.stat b{display:block;font-family:var(--mono);font-size:1.3rem}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.abils6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.abils6 div{text-align:center;border:1px solid var(--line);border-radius:5px;padding:6px 2px}
.abils6 b{display:block;font-family:var(--mono)}
.abils6 small{display:block;font-size:.7rem;color:var(--muted)}
.list{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.anchor{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}

/* importer */
.imp{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.drop{display:grid;place-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:var(--r);padding:22px 12px;cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--display);font-size:1.2rem}
.mode{display:grid;gap:8px}
.mode label{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;border:1px solid var(--line);border-radius:5px;padding:9px;font-size:.9rem;align-items:start}
.mode label.off{opacity:.65}
.mode label span{font-size:.82rem;color:var(--muted);grid-column:2}
.readout{font-family:var(--mono);font-size:.78rem;display:grid;gap:3px;color:var(--muted)}
.readout b{color:var(--ink);font-weight:600}
.rtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.rtab{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:baseline;margin-bottom:-1px}
.rtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rtab .n{font-family:var(--mono);font-size:.75rem}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.res{display:grid;gap:6px;align-content:start}
.res.out{opacity:.5}
.res-top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.res-top label{display:flex;gap:7px;align-items:baseline;font-weight:700;font-size:1.02rem;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.88rem}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0}
.send{position:sticky;bottom:0;margin-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}

/* library */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.prod .pitch{font-size:1.25rem}
.grp{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-top:0}
.frow{display:grid;grid-template-columns:16px minmax(0,1fr) auto auto auto;gap:4px 10px;align-items:center;font-size:.9rem;padding:3px 0}
.frow .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .star{color:var(--gold);font-weight:700}
.frow.copy{opacity:.55}
.frow .row{flex-wrap:wrap}
.rt{width:100%;border-collapse:collapse;font-size:.85rem}
.rt td{border-top:1px solid var(--line);padding:3px 6px;vertical-align:top}
.rt td:first-child{white-space:nowrap;color:var(--accent);font-weight:600}
@media (max-width:640px){ .frow{grid-template-columns:16px minmax(0,1fr) auto} .frow>.row,.frow>.mono{grid-column:2 / -1} }

/* campaign */
.seg2{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
.seg2 .rtab{border:0;border-radius:4px;margin:0;padding:5px 12px}
.seg2 .rtab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.camp{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.advrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.advrow:first-of-type{border-top:0}
.arcstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0}
.arcnum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600}
.lvlbar{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:6px 0;max-width:420px}
.lvlbar i{height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.lvlbar i.on{background:var(--accent);border-color:var(--accent)}
.lvlbar.unknown{display:block;font-size:.8rem;color:var(--muted)}
.bridge{margin:0 0 0 15px;padding:8px 0 8px 24px;border-left:2px dashed var(--line);display:grid;gap:6px}
.thread{background:var(--surface-2);border-radius:5px;padding:8px 10px;display:grid;gap:4px}
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem;padding:4px 0}
@media (max-width:820px){ .camp{grid-template-columns:minmax(0,1fr)} }

/* desk */
.desk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.desk-grid.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);margin-top:14px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.beat{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.beat:first-of-type{border-top:0}
.beat .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);margin-top:3px;cursor:pointer;background:none;padding:0}
.beat.active .dot{border-color:var(--accent);background:var(--accent)}
.beat.done .dot{border-color:var(--muted);background:var(--muted)}
.beat.done h4{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.beat p{font-size:.9rem;color:var(--muted);grid-column:2}
.beat .branches{grid-column:2;font-size:.85rem;display:grid;gap:3px}
.hook{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.hook:first-of-type{border-top:0}
.clock{display:inline-flex;gap:2px;cursor:pointer;background:none;border:0;padding:2px;align-items:center}
.clock i{width:13px;height:13px;border:1.5px solid var(--warn);border-radius:2px}
.clock i.on{background:var(--warn)}
.clock.full i{border-color:var(--bad)}
.clock.full i.on{background:var(--bad)}
.hook select{width:auto;padding:3px 6px;font-size:.85rem}
.npc{border-top:1px solid var(--line);padding:10px 0}
.npc:first-of-type{border-top:0}
.npc button.nm{font:inherit;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left;display:flex;justify-content:space-between;width:100%;gap:8px}
.npc .rp{display:grid;gap:6px;margin-top:8px;font-size:.9rem}
.npc .rp div{display:grid;grid-template-columns:76px 1fr;gap:8px}
.npc .rp dt{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.enc{border:1px solid var(--line);border-radius:5px;padding:12px;display:grid;gap:6px;background:var(--surface-2)}
.encs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.builder{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.builder .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foe-add{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:end}

.quote{font-style:italic;color:var(--muted);font-size:.95rem}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}

/* dialog */
dialog.dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:min(640px,calc(100% - 32px));max-height:85vh;overflow:auto;padding:20px}
dialog.dialog.wide{width:min(1100px,calc(100% - 32px))}
dialog.dialog::backdrop{background:rgba(8,12,16,.55)}
.dialog-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
dialog.dialog img.preview{width:100%;height:auto;border-radius:4px;background:var(--surface-2)}
.dc{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px;font-size:.92rem}
.dc-ch{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.dc-bot{display:flex;gap:8px;align-items:center}
.dc-av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.dc-embed{border-left:3px solid var(--accent);background:var(--surface);border-radius:4px;padding:10px 12px;display:grid;gap:6px;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;z-index:60;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}

@media (max-width:1100px){
  .cb-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
  .cb-log{grid-column:1 / -1}
  .desk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .imp,.cb-grid,.desk-grid,.desk-grid.two,.sheet{grid-template-columns:minmax(0,1fr)}
  .abil{grid-template-columns:44px 44px 1fr}
  .abil .bar{display:none}
  .builder .g{grid-template-columns:1fr}
}
@media (max-width:520px){
  .seg{grid-template-columns:1fr}
  .seg.six{grid-template-columns:1fr 1fr}
  .abils6{grid-template-columns:repeat(3,1fr)}
  .sheet .stats{grid-template-columns:repeat(2,1fr)}
  .rollrow{grid-template-columns:1fr auto}
  .rollrow .or{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .outcome .result{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
}
</style>

const SAMPLE_TEXT=`THE DROWNED LANTERN
A short adventure for three to five characters of 2nd to 4th level.

Adventure Background
Ten years ago the lighthouse of Saltmere went dark during a storm, and the whole fishing fleet was lost on the rocks. Now a green light burns in the empty tower every new moon, and the drowned walk the beach.

Adventure Hooks
- Harbor master Odile Varn offers 50 gp to anyone who can explain the green light at the old lighthouse.
- A drunk fisherman at the Gull & Anchor swears his drowned brother waved at him from the surf.
- A coded letter is found on a smuggler whose body washed ashore. It names "the Keeper" and a date three days from now.

Part 1: Arrival in Saltmere
The characters reach Saltmere at dusk. The town is quiet, the shutters are closed early, and nobody looks at the lighthouse. If the characters ask about the fleet, the locals change the subject. If the characters visit the shrine, Mother Grayle offers them a blessing and a warning.

Characters in Saltmere
Odile Varn, the harbor master, is a stern, tired woman who counts everything twice. She wants the fleet's insurance claim settled before the guild sends an inspector. Secret: she paid the keeper to douse the light so a smuggler ship could land.
Pell Hask, a nervous young fisherman, talks too fast and fidgets with a fishhook necklace. He wants to know what really happened to his brother. He fears the water and will not set foot on a boat.
Mother Grayle, an old cheerful priestess of the sea, hums shanties and answers questions with riddles. She fears the Lantern Society and hides their symbol in her shrine.

Part 2: The Smugglers' Cove
A narrow path leads down the cliffs to a hidden cove where smugglers still unload crates by night. Among the crates the characters find a Scroll of Fog Cloud and a ledger with Odile's signature. If the characters wait until dark, a boat with a green lantern arrives.

Smuggler Lookout
Medium humanoid, neutral
Armor Class 12
Hit Points 11 (2d8 + 2)
Speed 30 ft.
Challenge 1/4 (50 XP)
Shortsword. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 4 (1d6 + 1) piercing damage.
Signal Whistle. The lookout blows a whistle that alerts everyone in the cove.

Part 3: The Old Lighthouse
The tower door is swollen shut and seaweed hangs from the stairs. The green flame at the top is fed by the Lantern Society, who believe it calls the drowned fleet home. If the characters climb the tower quietly, they can overhear the cultists' plan.

Map: The Old Lighthouse
L1. Flooded Ground Floor. Water is knee-deep and something moves beneath it.
L2. Keeper's Quarters. A rotting bed, a logbook, and the keeper's spyglass on a hook.
L3. Lantern Room. A green flame burns in the great lens. Two cultists keep it lit.

Lantern Cultist
Medium humanoid, chaotic neutral
Armor Class 12
Hit Points 9 (2d8)
Speed 30 ft.
Challenge 1/2 (100 XP)
Sickle. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 4 (1d4 + 2) slashing damage.
Green Flame. The cultist hurls a mote of green fire. Each creature within 10 feet must make a DC 11 Dexterity saving throw.

Drowned Keeper
Medium undead, neutral evil
Armor Class 13
Hit Points 45 (7d8 + 14)
Speed 30 ft., swim 30 ft.
Challenge 2 (450 XP)
Undead Fortitude. If damage reduces the keeper to 0 hit points, it can make a Constitution saving throw to drop to 1 hit point instead.
Slam. Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 9 (2d6 + 2) bludgeoning damage.
Drag Under. The keeper grabs a creature in water and pulls it beneath the surface.

Treasure
Keeper's Spyglass (wondrous item, uncommon). While looking through it you can see invisible creatures within 60 feet.
Potion of Water Breathing (potion, uncommon). For one hour you can breathe underwater.
A pouch holding 35 gp and a silver locket with a portrait of Pell's brother.

Conclusion
If the characters put out the green flame, the drowned return to the sea and Saltmere's fleet can be mourned at last. If Odile's secret comes out, the town turns on her, and the Lantern Society marks the characters as enemies.`;

const STAT_RE=/^(armor class|hit points|speed|challenge|saving throws|skills|senses|languages|damage (resistances|immunities|vulnerabilities)|condition immunities|proficiency bonus|(str|dex|con|int|wis|cha)\b)/i;
const PERSON_RE=/\b(woman|man|keeper|master|priest|priestess|fisherman|fisher|merchant|guard|captain|smuggler|child|boy|girl|sailor|innkeeper|noble|lord|lady|wizard|mage|cultist|elder|widow|hunter|thief|knight|soldier|scholar|sage|healer|blacksmith|bard|farmer|mayor|baron|duke|queen|king|prince|princess|witch|hermit|sheriff|cook|servant|apprentice|monk|druid)\b/i;
const TRAITS=[
  ['stern','Short, flat sentences. Never says please.','Taps the table while others talk.'],
  ['tired','Sighs before answering and repeats questions back.','Rubs their eyes and leans on things.'],
  ['nervous','Talks too fast and trails off mid-sentence.','Fidgets with something small and avoids eye contact.'],
  ['cheerful','Warm and sing-song; laughs at their own jokes.','Leans in close and touches people\'s arms.'],
  ['old','Slow, with long pauses to remember names.','Squints and lowers themself into chairs carefully.'],
  ['young','Eager; interrupts and asks questions back.','Can\'t stand still.'],
  ['gruff','Grunts and gives one-word answers until impressed.','Arms crossed, chin up.'],
  ['greedy','Steers every topic back to money.','Weighs coins in their hand while talking.'],
  ['suspicious','Answers questions with questions.','Watches the door; keeps a hand near a weapon.'],
  ['kind','Soft voice; uses the party\'s names.','Offers food or a seat before anything else.'],
  ['proud','Formal words; corrects other people\'s mistakes.','Straight back; never sits first.'],
  ['drunk','Slurred, overly honest, wanders off topic.','Sways and spills things.'],
  ['cruel','Quiet and amused at other people\'s pain.','Smiles at the wrong moments.'],
  ['riddle','Answers in riddles and half-truths.','Hums between sentences.'],
  ['fidget','Starts sentences twice.','Plays with whatever is in their hands.'],
  ['counts','Corrects numbers, even small ones.','Counts things under their breath.']
];
const sentences=t=>t.split(/(?<=[.!?])\s+/).filter(Boolean);
let _uid=0; const uid=p=>p+(Date.now().toString(36))+(_uid++);
function crNum(s){ if(!s) return 1; if(s.includes('/')){const [a,b]=s.split('/');return +a/+b;} return +s||1; }
function tierFor(cr){ if(cr<=0.25) return ['Minion',1]; if(cr<=1) return ['Standard',2]; if(cr<=4) return ['Elite',3]; return ['Boss',4]; }
function isHeading(l){
  if(!l) return false;
  if(l.startsWith('# ')) return true;
  if(STAT_RE.test(l)) return false;
  if(l.length>60 || /[.;,!?]$/.test(l) || /^[-•*]/.test(l)) return false;
  if(/^(part|chapter|act)\s+\w+/i.test(l) || /^map\b/i.test(l)) return true;
  const w=l.split(/\s+/); if(w.length>8) return false;
  const caps=w.filter(x=>/^[A-Z0-9&'"(]/.test(x)).length;
  return caps/w.length>=0.6;
}
function parseAdventure(raw){
  const lines=raw.replace(/\r/g,'').split('\n').map(l=>l.trim());
  const sections=[]; let cur={title:'Opening',paras:[]}; sections.push(cur);
  let para=null;
  const flush=()=>{ if(para){cur.paras.push(para); para=null;} };
  let headings=0;
  for(const l of lines){
    if(!l){ flush(); continue; }
    if(isHeading(l)){ flush(); headings++; cur={title:l.replace(/^#\s*/,''),paras:[]}; sections.push(cur); continue; }
    const startsNew=/^[-•*]\s|^[A-Z]{0,2}\d{1,2}\.\s/.test(l)||STAT_RE.test(l)||!para||/[.!?:"”)]$/.test(para)||STAT_RE.test(para);
    if(startsNew){ flush(); para=l; } else para+=' '+l;
  }
  flush();

  const out={beats:[],npcs:[],maps:[],enemies:[],items:[],hooks:[],stats:{headings,paras:0,sorted:0}};
  const seen=new Set();
  let lastMap=null;
  const sorted=new Set();
  for(const sec of sections){
    const t=sec.title, paras=sec.paras; out.stats.paras+=paras.length;
    const acIdx=paras.findIndex(p=>/^armor class\s+\d+/i.test(p));
    if(acIdx>=0){
      const get=re=>{const p=paras.find(x=>re.test(x)); return p?p.replace(re,'').trim():'';};
      const type=(paras.find(p=>/^(tiny|small|medium|large|huge|gargantuan)\b/i.test(p))||'').trim();
      const crRaw=(get(/^challenge\s*/i).match(/[\d/]+/)||[''])[0];
      const cr=crNum(crRaw); const [tier,slots]=tierFor(cr);
      const kind=(type.match(/\b(humanoid|undead|beast|construct|fiend|monstrosity|aberration|elemental|fey|giant|dragon|ooze|plant|celestial)\b/i)||['','creature'])[1].toLowerCase();
      const moves=paras.map(p=>p.match(/^([A-Z][A-Za-z' ]{2,30})\.\s/)).filter(m=>m&&!STAT_RE.test(m[1])).map(m=>m[1]);
      let breakAt=null, breaking='Fights until destroyed';
      if(kind==='humanoid'){ if(slots>1){breakAt=slots-1; breaking='Flees or surrenders once hurt';} else breaking='Drops or runs at the first hit'; }
      else if(kind==='beast'||kind==='monstrosity'){ breakAt=Math.max(1,slots-1); breaking='Flees when badly hurt'; }
      const goal={humanoid:'Get paid and get out alive',undead:'Drag the living into its domain',beast:'Eat or escape'}[kind]||'Defend its ground';
      const actions=paras.map(p=>p.match(/^([A-Z][\w'’ ()/,-]{1,48}?)\.\s+(.+)$/)).filter(m=>m&&!STAT_RE.test(m[1])).map(m=>({name:m[1].trim(),text:m[2]}));
      const hpStats=QBAttacks.fromStatBlock({hp:get(/^hit points\s*/i),ac:get(/^armor class\s*/i),cr:crRaw,kind,actions});
      out.enemies.push({id:uid('b'),name:t,type,ac:get(/^armor class\s*/i),hp:get(/^hit points\s*/i),cr:crRaw||'?',tier,slots,breakAt,breaking,goal,moves:moves.length?moves:['Attack'],...hpStats,include:true,why:'stat block: "Armor Class" + "Challenge"'});
      seen.add(t.toLowerCase()); sorted.add(sec); continue;
    }
    if(/hook|rumou?r/i.test(t)){
      paras.forEach(p=>out.hooks.push({id:uid('h'),text:p.replace(/^[-•*]\s*/,''),include:true,why:'listed under "'+t+'"'}));
      sorted.add(sec); continue;
    }
    if(/^map\b/i.test(t)){ lastMap={id:uid('m'),name:t.replace(/^map:?\s*/i,''),areas:[],include:true,why:'"Map" heading + keyed areas'}; out.maps.push(lastMap); sorted.add(sec); }
    const isTreasure=/treasure|loot|rewards|items/i.test(t);
    for(const p of paras){
      const area=p.match(/^([A-Z]{0,2}\d{1,2})\.\s+([^.]+)\.\s*(.*)$/);
      if(area){
        if(!lastMap){lastMap={id:uid('m'),name:t,areas:[],include:true,why:'keyed areas (A1., 2. …)'}; out.maps.push(lastMap);}
        lastMap.areas.push({key:area[1],name:area[2],desc:area[3]}); continue;
      }
      if(isTreasure){
        const name=p.split(/[(.]/)[0].trim();
        out.items.push({id:uid('i'),name,desc:p.slice(name.length).replace(/^\s*\([^)]*\)\.?\s*|^\.\s*/,''),rarity:(p.match(/\b(common|uncommon|rare|very rare|legendary)\b/i)||[''])[0],include:true,why:'listed under "'+t+'"'});
        sorted.add(sec); continue;
      }
      for(const m of p.matchAll(/\b(?:[Pp]otions?|[Ss]crolls?|[Rr]ings?|[Ww]ands?|[Cc]loaks?|[Aa]mulets?|[Bb]oots|[Ss]taffs?) of ((?:[A-Z][\w']+\s?)+)/g)){
        const name=m[0].trim().replace(/^./,c=>c.toUpperCase());
        if(!out.items.some(i=>i.name.toLowerCase()===name.toLowerCase())) out.items.push({id:uid('i'),name,desc:'Mentioned in "'+t+'"',rarity:'',include:true,why:'"… of <Name>" item pattern'});
      }
      const npc=p.match(/^([A-Z][a-z'’]+(?:\s[A-Z][a-z'’]+){0,2}),\s+(?:a|an|the)\s+([^,.]+)/);
      if(npc && (PERSON_RE.test(npc[2])||/\b(she|he|they)\b/i.test(p)) && !seen.has(npc[1].toLowerCase())){
        const desc=p, low=desc.toLowerCase(), ss=sentences(desc);
        const hits=TRAITS.filter(([k])=>new RegExp('\\b'+k).test(low));
        const secret=(ss.find(s=>/^secret\b/i.test(s))||'').replace(/^secret:?\s*/i,'');
        out.npcs.push({id:uid('n'),name:npc[1],role:npc[2].trim(),desc,
          wants:(ss.find(s=>/\b(wants?|seeks?|hopes?)\b/i.test(s))||'').trim(),
          fears:(ss.find(s=>/\b(fears?|afraid)\b/i.test(s))||'').trim(),
          secret,
          voice:hits[0]?hits[0][1]:'Borrow how someone you know talks, and keep it the same each time.',
          manner:(hits[1]||hits[0])?(hits[1]||hits[0])[2]:'Give them one repeated gesture the players will remember.',
          pressed:secret?'Lies at first. Gives the secret up if shown proof, threatened, or offered a way out.':'Has nothing to hide, but wants something in return for help.',
          include:true,why:'"Name, a/the role" pattern'+(hits.length?' + trait words: '+hits.map(h=>h[0]).join(', '):'')});
        seen.add(npc[1].toLowerCase()); sorted.add(sec);
      }
    }
    if(/^(part|chapter|act)\b/i.test(t)||/^(conclusion|epilogue|finale|introduction)\b/i.test(t)){
      const body=paras.join(' '); const ss=sentences(body);
      out.beats.push({id:uid('s'),title:t,summary:ss.filter(s=>!/^if the (characters|party)/i.test(s)).slice(0,2).join(' '),branches:ss.filter(s=>/^if the (characters|party)/i.test(s)),include:true,why:/^(part|chapter|act)/i.test(t)?'"Part / Chapter" heading':'"'+t+'" heading'});
      sorted.add(sec);
    }
  }
  out.stats.sorted=sorted.size; out.stats.sections=sections.length;
  return out;
}
/*PARSER-END*/

function sendToDesk(s,res){
  let n=0;
  const add=(arr,item,key='name')=>{ if(item.include===false) return; if(arr.some(x=>(x[key]||'').toLowerCase()===(item[key]||'').toLowerCase())) return; arr.push(item); n++; };
  res.beats.forEach(b=>add(s.beats,{...b,status:'upcoming'},'title'));
  const next=s.beats.find(b=>b.status!=='done');
  if(!s.beats.some(b=>b.status==='active')&&next) next.status='active';
  res.hooks.forEach(h=>add(s.hooks,{id:h.id,text:h.text,status:'dangling',clock:0,source:'Imported',include:h.include},'text'));
  res.npcs.forEach(x=>add(s.npcs,{...x,open:false}));
  res.enemies.forEach(x=>add(s.bestiary,x));
  res.maps.forEach(x=>add(s.maps,x));
  res.items.forEach(x=>add(s.items,x));
  return n;
}
function fresh(){
  const s={tab:'home',party:samplePCs(),beats:[],hooks:[],npcs:[],bestiary:[],maps:[],items:[],encounters:[],
    creator:{step:0,cls:null,anc:null,name:'',left:'',want:'',fear:'',abil:null,swap:null},

    tables:[],
    draft:{name:'',where:'',goal:'',foes:[],pick:'',n:1},
    combat:null};
  sendToDesk(s,parseAdventure(SAMPLE_TEXT));
  s.beats[0].status='done'; s.beats[1].status='active';
  const by=re=>s.bestiary.find(e=>re.test(e.name));
  const look=by(/lookout/i), cult=by(/cultist/i), keep=by(/keeper/i);

  s.encounters.push({id:uid('e'),name:'The Lantern Room',where:'L3. Lantern Room',goal:'Keep the green flame burning until the fleet arrives',foes:[{ref:keep.id,n:1},{ref:cult.id,n:2}]});

function hpFor(cls,anc,abil,level=1){ const c=CLASSES[cls]; const per=Math.floor(c.die/2)+1; return c.die+mod(abil.CON)+(level-1)*(per+mod(abil.CON))+((ANCESTRY[anc]||{}).hp||0)*level; }
// HP combat fields on a hero. Fills only what is missing, so older saves and edited sheets keep their values.
function heroDefaults(p){
  const lvl=Number(p.level)||1;
  if(!(Number(p.hp)>0)) p.hp=hpFor(p.cls,p.anc,p.abil,lvl);
  if(!Number.isFinite(p.hpNow)) p.hpNow=p.hp;
  if(!p.hitDice) p.hitDice={die:(CLASSES[p.cls]||CLASSES.Fighter).die,left:lvl};
  if(!Number.isFinite(p.stamina)) p.stamina=QBAttacks.profFor(lvl);
  if(!p.attack) p.attack={...(QBAttacks.STARTER[p.cls]||QBAttacks.STARTER.Fighter)};
  return p;
}
// HP combat fields on an enemy: numbers read from the stat block, or from the text of older saves.
// Missing numbers on a standard monster come from SRD 5.1; the book's own stat block always wins.
function hpFields(e){
  const own={hpMax:e.hpMax??QBAttacks.firstInt(e.hp),acNum:e.acNum??QBAttacks.firstInt(e.ac),crNum:e.crNum??QBAttacks.crValue(e.cr),
    attacks:e.attacks||[],turn:e.turn||[],breaks:e.breaks??/humanoid|beast|monstrosity/i.test(e.type||e.kind||'')};
  const srd=QBAttacks.fillFromSrd({...own,name:e.name,type:e.type});
  return {...own,...srd,statsFrom:e.statsFrom||srd.statsFrom};
}

  const bar=l=>{ if(!l) return '<div class="lvlbar unknown"><span>?</span></div>'; return `<div class="lvlbar" title="${lvlText(l)}">${Array.from({length:20},(_,i)=>`<i class="${i+1>=l.min&&i+1<=l.max?'on':''}"></i>`).join('')}</div>`; };
  const linkHtml=(l,A,B)=>`<div class="thread"><div class="row" style="gap:6px"><span class="chip ${l.type==='artifact'?'gold':l.type==='villain'?'bad':l.type==='theme'?'':'acc'}">${{artifact:'Artifact',villain:'Villain',character:'Character',name:'Shared name',theme:'Theme'}[l.type]}</span><b>${esc(l.type==='theme'?l.themes.map(t=>THEME_LABEL[t]||t).join(', '):l.name)}</b></div>

  const ideaBtns=(ideas,A,B)=>ideas.map(t=>{const used=C.bridges.some(b=>b.text===t);return `<div class="idea"><span>${esc(t)}</span><button class="btn sm ${used?'':'primary'}" data-act="camp-bridge" data-from="${A.id}" data-to="${B.id}" data-text="${esc(t)}" ${used?'disabled':''}>${used?'Added':'Use this link'}</button></div>`;}).join('');

    const b=advs[k+1]; if(!b) return;
    const L1=a.profile.levels, L2=b.profile.levels;
    const gap=L1&&L2?(L2.min-L1.max>1?`The party needs to gain ${L2.min-L1.max-1} level${L2.min-L1.max-1>1?'s':''} between these. Add a side adventure, or level them up between sessions.`:L2.max<L1.min?'This one is for lower levels than the one before. Scale its enemies up, or swap the order.':''):'';
    const direct=links.filter(l=>(l.a===k&&l.b===k+1)||(l.a===k+1&&l.b===k));
    const shown=direct.filter(l=>l.type!=='theme').slice(0,3), theme=direct.find(l=>l.type==='theme');
    const lead=shown[0]||(theme?{...theme,name:theme.themes.map(t=>(THEME_LABEL[t]||t).toLowerCase()).join(' and ')}:{type:'none',name:''});
    const ideas=QB.bridgeIdeas(lead,{...a.profile,title:a.product},{...b.profile,title:b.product});
    arc+=`<div class="bridge">${gap?`<p class="small" style="color:var(--warn)">⚠ ${esc(gap)}</p>`:''}
      ${shown.length||theme?`<div class="eyebrow">What these two already share</div>${[...shown,...(theme?[theme]:[])].map(l=>linkHtml(l,l.a===k?a:b,l.a===k?b:a)).join('')}`:'<p class="small muted">No shared names or themes found. Here are ways to connect them anyway.</p>'}
      <div class="eyebrow" style="margin-top:6px">Bridge ideas</div>${ideaBtns(ideas,a,b)}</div>`;
  });
  const far=links.filter(l=>l.type!=='theme'&&Math.abs(l.a-l.b)>1);
  const used=C.bridges.map((b,i)=>`<div class="idea"><span>${esc(b.text)}</span><button class="btn sm ghost" data-act="camp-unbridge" data-i="${i}">Remove</button></div>`).join('');
  return head+`<div class="camp">
    <div class="card stack"><div class="col-h"><h3>Your adventures</h3><span class="small muted">${all.length} read</span></div>${pick}</div>
    <div class="stack" style="min-width:0">
      <div class="card"><div class="col-h"><h3>Adventure order</h3>${advs.length>1?'<button class="btn sm" data-act="camp-suggest">Sort by level</button>':''}</div>
        ${advs.length?arc:'<div class="empty">Add adventures from the list to start the arc.</div>'}</div>
      ${far.length?`<div class="card"><div class="col-h"><h3>Threads across the campaign</h3><span class="small muted">links between adventures that aren't next to each other</span></div>${far.slice(0,8).map(l=>`<p class="small"><b>${esc(l.name)}</b> links <b>${esc(advs[l.a].product)}</b> and <b>${esc(advs[l.b].product)}</b>. ${esc(l.ctxB||l.ctxA||'')}</p>`).join('')}</div>`:''}
      ${used?`<div class="card"><div class="col-h"><h3>Bridges you chose</h3><span class="small muted">also on the DM desk as leads</span></div>${used}</div>`:''}
    </div></div>`;
}

    ${n.open?`<dl class="rp">${n.line?`<div><dt>Says</dt><dd class="quote">“${esc(n.line)}”</dd></div>`:''}${n.look?`<div><dt>Looks</dt><dd>${esc(n.look)}</dd></div>`:''}${n.knows?`<div><dt>Knows</dt><dd>${esc(n.knows)}</dd></div>`:''}${n.wants?`<div><dt>Wants</dt><dd>${esc(n.wants)}</dd></div>`:''}${n.fears?`<div><dt>Fears</dt><dd>${esc(n.fears)}</dd></div>`:''}${n.secret?`<div><dt>Secret</dt><dd>${esc(n.secret)}</dd></div>`:''}<div><dt>Voice</dt><dd>${esc(n.voice)}</dd></div><div><dt>Gesture</dt><dd>${esc(n.manner)}</dd></div><div><dt>Pressed</dt><dd>${esc(n.pressed)}</dd></div></dl>`:''}</div>`).join('')||'<div class="empty">No people yet.</div>';
  const encs=S.encounters.map(e=>`<div class="enc"><div class="row" style="justify-content:space-between"><b>${esc(e.name)}</b><span class="small muted">${esc(e.where)}</span></div>

    <div class="row"><button class="btn sm primary" data-act="enc-run" data-id="${e.id}">Start this fight</button><button class="btn sm ghost" data-act="enc-del" data-id="${e.id}">Remove</button></div></div>`).join('');
  const D=S.draft;
  const builder=`<div class="builder"><h4>Prepare a fight</h4>

    <label class="f" for="en-where">Where<input id="en-where" data-bind="draft.where" list="areas" value="${esc(D.where)}" placeholder="Pick a map area or type one"></label></div>
    <datalist id="areas">${S.maps.flatMap(m=>m.areas.map(a=>`<option value="${esc(a.key+'. '+a.name)}">`)).join('')}</datalist>
    <label class="f" for="en-goal">What do the enemies want? (not just "kill the party")<input id="en-goal" data-bind="draft.goal" value="${esc(D.goal)}" placeholder="Escape with the ledger"></label>
    <div class="foe-add"><label class="f" for="en-pick">Add enemies<select id="en-pick" data-bind="draft.pick">${S.bestiary.map(b=>`<option value="${b.id}" ${D.pick===b.id?'selected':''}>${esc(b.name)} (${b.tier})</option>`).join('')}</select></label>
      <label class="f" for="en-n">How many<input id="en-n" type="number" min="1" max="12" data-bind="draft.n" value="${D.n}"></label><button class="btn" data-act="enc-addfoe">Add enemies</button></div>
    ${D.foes.length?`<div class="pickrow">${D.foes.map((f,i)=>{const b=S.bestiary.find(x=>x.id===f.ref);return `<button class="chip" data-act="enc-rmfoe" data-i="${i}" title="Remove">${f.n}× ${esc(b?b.name:'?')} ✕</button>`;}).join('')}</div>`:''}

  return `<div class="pagehead"><div><div class="eyebrow">DM desk</div><h2>${active?esc(active.title):'Your campaign'}</h2>

/* ---------- starting a fight ---------- */
// Three or more of one creature fight as a group: one card, each member keeps its own HP, the group breaks at half down.
function startCombat(s,enc){
  const foes=[];
  enc.foes.forEach(f=>{const b=s.bestiary.find(x=>x.id===f.ref); if(!b) return; const group=f.n>=3?uid('g'):undefined;
    for(let i=0;i<f.n;i++) foes.push({id:uid('f'),name:b.name+(f.n>1?' '+(i+1):''),type:b.type,tier:b.tier,breaking:b.breaking,goal:b.goal,moves:b.moves,...hpFields(b),ref:b.id,group,groupName:group?b.name:undefined,status:'fighting',startZone:f.zone||b.zone,privatePlan:f.privatePlan??b.privatePlan??'',observableTell:f.observableTell??b.observableTell??'',concealed:f.concealed??b.concealed??false,publicName:f.publicName||b.publicName||b.name+(f.n>1?' '+(i+1):'')});
  });
  s.combat={enc:enc.id,name:enc.name,where:enc.where,goal:enc.goal,foes,round:1,log:[{kind:'scene',text:`The fight begins: ${enc.name}. No initiative roll: the DM chooses who acts first.`}]};
  Stakes.init(s);
  EncounterDesign.start(s,enc);
  return s.combat;
}

/* ---------- dialogs: Discord preview, end of a fight ---------- */
function discordText(what){
  if(what==='sheet'){ const c=crState(), s=crSheet(c), atk=s.attacks[0]; return {ch:'#characters',title:`New hero: ${c.build.name||'?'}`,body:`Level ${s.level} ${s.species} ${s.cls}${s.subclass?' ('+s.subclass+')':''} · ${s.background}\nHP ${s.hp.max} · AC ${s.ac} · Speed ${s.speed}${atk?`\n${atk.name} ${fmt(atk.bonus)}, ${atk.damage}`:''}\n${ABIL.map(k=>`${APPROACH[k].name} ${fmt(s.mods[k])}`).join(' · ')}\nWants: ${c.story.want||'?'}`}; }
  if(what==='recap'){ const done=S.beats.filter(b=>b.status==='done').map(b=>b.title), act=S.beats.find(b=>b.status==='active'); return {ch:'#session-recaps',title:'Last time…',body:`${done.length?'Done: '+done.join(', ')+'\n':''}${act?'Now: '+act.title+'\n':''}Open threads:\n${S.hooks.filter(h=>h.status==='dangling'||h.status==='taken').slice(0,4).map(h=>'• '+h.text).join('\n')}`}; }
  const C=S.combat; return {ch:'#the-table',title:C?C.name:'Scene',body:C?C.log.slice(0,4).reverse().map(e=>'• '+e.text).join('\n'):''};
}
function discordPreview(what){
  const d=discordText(what);
  openDialog('What the Discord bot would post',`<div class="dc"><div class="dc-ch">${d.ch}</div><div class="dc-bot"><span class="dc-av">Q</span><b>Quillbound</b><span class="chip">BOT</span></div><div class="dc-embed"><b>${esc(d.title)}</b>${esc(d.body)}</div></div>
    <p class="small muted">Preview only: the Discord bot isn't connected yet, so nothing was sent.</p>`);
}
// End of a fight: loose ends (who fled, surrendered or made a deal) can become leads on the DM desk.
function endFightDialog(leads){
  const C=S.combat;
  const dlg=openDialog(`How did ${C.name} end?`,`<div class="stack small">${leads.length?`<div><div class="eyebrow" style="margin-bottom:6px">New leads from this fight</div>${leads.map((h,i)=>`<label class="row" style="flex-wrap:nowrap;align-items:baseline;margin-bottom:4px"><input type="checkbox" id="end-lead-${i}" checked> ${esc(h)}</label>`).join('')}</div>`:'<p class="muted">Nobody escaped, surrendered or made a deal, so there are no loose ends.</p>'}
    <p>Hit points, stamina and conditions stay as they are. Rest afterwards: a short rest spends Hit Dice to heal, a long rest restores everything.${S.party.some(p=>p.hpNow<=0&&!p.dead)?' Heroes still at 0 HP stay unconscious until they are healed.':''}</p></div>
    <div class="row"><button class="btn primary" id="end-confirm">Back to roleplay</button><button class="btn" id="end-cancel">Keep fighting</button></div>`);
  dlg.querySelector('#end-cancel').onclick=()=>dlg.close();
  dlg.querySelector('#end-confirm').onclick=()=>{
    leads.forEach((h,i)=>{ if(dlg.querySelector('#end-lead-'+i).checked) S.hooks.unshift({id:uid('h'),text:h,status:'dangling',clock:0,source:'Fight'}); });
    S.combat=null; S.tab='desk'; S.deskView='session'; dlg.close(); render(); toast('Fight ended. New leads are on the DM desk.');
  };
}

/* ---------- importer glue (the heavy lifting is in src/app/library-session.js) ---------- */
async function libRun(label,job){
  const I=S.importer;
  if(!window.QB){ I.status='The importer is still loading. Try again in a moment.'; render(); return; }
  I.busy=true; I.status=label; render();
  // progress messages arrive fast; repaint at most every 150 ms
  let last=0; const progress=msg=>{ I.status=msg; const now=Date.now(); if(now-last>150){ last=now; render(); } };
  try{ await job(progress); I.status=''; }
  catch(e){ console.error(e); I.status=e.message||String(e); }
  I.busy=false; render();
}
const libAddFiles=files=>libRun('Looking through the files…',async()=>{ S.importer.lib=await QB.addFileList([...files]); S.importer.phase='library'; sceneMapsRetryMissing(); });

const libRead=()=>libRun('Loading the PDF reader…',async progress=>{
  const r=await QB.readProduct(S.importer.pi,progress);
  for(const k of ['beats','hooks','npcs','enemies','locations','items','tables','libraryMaps']) (r[k]||[]).forEach(x=>{ if(x.include===undefined) x.include=true; });
  r.items.forEach(x=>{ if(x.mention) x.include=false; });       // passing mentions start unticked
  r.enemies.forEach(x=>{ if(x.fromCard) x.include=true; });
  S.importer.result=r; S.importer.phase='results'; S.importer.view='story';
  rememberAdventure(r);
  if(r.stats.paragraphs<5) S.importer.status='Almost no text found. This PDF may be scanned pages, which the offline reader cannot read.';
});
// Every adventure that has been read is kept (as a small profile) for the campaign planner.
function rememberAdventure(r){
  S.adventures=S.adventures||[];
  const a={id:'adv-'+r.product.toLowerCase().replace(/[^a-z0-9]+/g,'-'),product:r.product,title:r.title||r.product,source:r.source,profile:{...r.profile,title:r.product},
    beats:r.beats.map(b=>b.title),npcs:r.npcs.map(n=>n.name),villains:r.profile.villains,loose:r.hooks.map(h=>h.title||h.text).slice(0,6)};
  const i=S.adventures.findIndex(x=>x.id===a.id);
  if(i>=0) S.adventures[i]=a; else S.adventures.push(a);
}
const libReadAll=(retry=false)=>libRun('Reading all adventures…',async progress=>{
  if(!S.importer.lib)throw Error('Reload the original files into the library before retrying PDF reading.');
  const previous=S.importer.readReport;
  const ps=S.importer.lib.products.filter(p=>p.type==='adventure' && (!retry || previous?.failed.some(f=>f.name===p.name)));
  let n=0, failed=[];
  for(const p of ps){
    n++;
    try{ rememberAdventure(await QB.readProduct(p.i,msg=>progress(`Book ${n} of ${ps.length}, ${p.name}: ${msg}`))); }
    catch(e){ failed.push({name:p.name,error:e.message||String(e)}); }
  }
  toast(`Read ${ps.length-failed.length} adventures. Open the DM desk → Campaign to connect them.`);
  S.importer.readReport={ready:(retry?previous?.ready||0:0)+ps.length-failed.length,failed};
});

// Reader output → DM desk records
function sendReaderResult(s,R){
  let n=0;
  const on=x=>x.include!==false;
  const add=(arr,item,key='name')=>{ if(arr.some(x=>(x[key]||'').toLowerCase()===(item[key]||'').toLowerCase())) return; arr.push(item); n++; };
  R.beats.filter(on).forEach(b=>add(s.beats,{id:b.id,title:b.title,summary:b.summary,branches:b.branches||[],question:b.question||'',transition:b.transition||'',senses:b.senses||[],readAloud:b.readAloud||[],page:b.page,source:R.product,status:'upcoming'},'title'));
  const next=s.beats.find(b=>b.status!=='done'); if(!s.beats.some(b=>b.status==='active')&&next) next.status='active';
  R.hooks.filter(on).forEach(h=>add(s.hooks,{id:h.id,text:(h.title?h.title+': ':'')+h.text,status:'dangling',clock:0,source:'Imported'},'text'));
  R.npcs.filter(on).forEach(x=>add(s.npcs,{id:x.id,name:x.name,role:x.role,wants:x.wants,fears:(x.fields&&x.fields.fear)||'',secret:x.secret,voice:x.voice,manner:x.manner,pressed:x.pressed,look:x.look,line:x.line,knows:x.knows,page:x.page,open:false}));
  R.enemies.filter(on).forEach(e=>add(s.bestiary,{id:e.id,name:e.name,type:e.type,ac:e.ac,hp:e.hp,cr:e.cr,tier:e.tier,slots:e.slots,breakAt:e.breakAt,breaking:e.breaking,goal:e.goal,moves:e.moves,card:e.card||'',...hpFields(e)}));
  const areasByBeat={};
  R.locations.filter(on).forEach(l=>{ (areasByBeat[l.beat||'Other areas']=areasByBeat[l.beat||'Other areas']||[]).push({key:l.key,name:l.name,text:l.text}); });
  (R.libraryMaps||[]).filter(on).forEach(m=>{ const areas=m.usedIn.flatMap(b=>areasByBeat[b]||[]); add(s.maps,{id:m.id,name:m.name,areas,variants:m.variants.map(v=>v.variant||'original'),usedIn:m.usedIn}); });
  for(const [beat,areas] of Object.entries(areasByBeat)) if(!s.maps.some(m=>m.areas.some(a=>areas.includes(a)))) add(s.maps,{id:uid('m'),name:beat,areas,variants:[],usedIn:[beat]});
  R.items.filter(on).forEach(x=>add(s.items,{id:x.id,name:x.name,desc:x.desc,rarity:x.rarity||(x.gp?x.gp+' gp':'')}));
  s.tables=s.tables||[];
  R.tables.filter(on).forEach(t=>add(s.tables,{id:t.id,title:t.title,die:t.die,rows:t.rows,last:''},'title'));
  return n;
}

// Keep the draft valid: a character who can act, a fitting target, and the sheet's ability for the action.
function combatSettle(){
  const l=Stakes.init(S); if(!l||l.pending) return; const d=l.draft;
  if(!Stakes.active(S,Stakes.actor(S,d.actor))){ const a=S.party.find(p=>Stakes.active(S,p)); if(a){ d.actor=a.id; d.mode='hero'; } }
  const ts=Stakes.targets(S,d); if(!ts.some(t=>t.id===d.target)) d.target=ts[0]?.id||'';
  Stakes.configure(S,d);
}
function combatPick(id){ const l=Stakes.init(S); if(l.pending) return; const a=Stakes.actor(S,id); if(!a) return;
  Object.assign(l.draft,{actor:id,mode:Stakes.hero(S,id)?'hero':'enemy',ability:'',target:'',intent:'',stakes:''}); combatSettle(); }

     ${Array.from({length:n-1},(_,k)=>k+1).map(i=>`<label class="f">Target for attack ${i+1}<select data-bind="combat.lite.draft.targets.${i}" data-rerender>
     ${ts.map(x=>`<option value="${esc(x.id)}" ${(d.targets?.[i]||d.target)===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`).join('')}</div>`:'';
  const attackPickers=choices.length>1?`<div class="lt-attack-picks"><p class="small muted">Choose the weapon for each attack. These choices share one Attack action; targets may differ.</p>${sequence.map((current,i)=>`<label class="f">Attack ${i+1}<select data-bind="combat.lite.draft.attackNames.${i}" data-rerender>${(i===0?choices:choices.filter(x=>x.count===sequence[0].count)).map(x=>`<option value="${esc(x.name)}" ${x.name===current.name?'selected':''}>${esc(x.name)} · d20 ${fmt(x.bonus)} · ${esc(x.damage)}${i===0?' · '+x.count+' roll'+(x.count===1?'':'s'):''}</option>`).join('')}</select></label>`).join('')}</div>`:'';
  const sheet=enemy?`<p class="lt-sheet">${esc(roller?.name||'The hero')} rolls <b>d20 ${fmt((roller?.ac||10)-10)}</b> (AC ${roller?.ac||10} − 10) for each attack and must beat 11 + its attack bonus.<span>${esc(a.name)}: ${esc(attackText(a))}</span></p>`
    :d.action==='attack'?`<p class="lt-sheet">${sequence.map((x,i)=>`${i+1}. ${esc(x.name)}: <b>d20 ${fmt(x.bonus)}</b>, damage ${esc(x.damage)}`).join(' · ')} against ${esc(t?.name||'the target')}’s AC ${t?.acNum??'?'}<span>One strike-back at most per Attack action, from the first eligible graze or miss while the enemy can respond.</span></p>`
    :combatCheckSummary(S,d,roller);
  const edge=enemy?ts.some(x=>(x.id===d.target||d.targets?.includes(x.id))&&(l.openings[x.id]||l.protected[x.id])):roller&&l.openings[roller.id];
  const enemyEffect=enemy?`<label class="f">If the defense fails<select data-bind="combat.lite.draft.enemyEffect" data-rerender>${[['damage',`Deal damage (${attackText(a)})`],['position','Change position'],['condition','Create a condition'],['goal','Advance an enemy objective'],['context','Resolve a physical situation (automatic conditions)']].map(([v,x])=>`<option value="${v}" ${d.enemyEffect===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>${d.enemyEffect!=='damage'?`<label class="f">Agree what happens before rolling<textarea data-bind="combat.lite.draft.enemyOutcome">${esc(d.enemyOutcome)}</textarea></label><p class="small muted">One defense roll against its best attack. On a failed defense, apply this stated consequence instead of damage.</p>`:''}${d.enemyEffect==='condition'?`<label class="f">Condition<input data-bind="combat.lite.draft.enemyCondition" value="${esc(d.enemyCondition)}"></label>`:''}${d.enemyEffect==='position'?zoneSelect('combat.lite.draft.destination',d.destination):''}`:'';
  return `<section class="lt-compose">${who}<div class="eyebrow">${enemy?'Enemy move · the hero rolls to defend':'1 · Choose an action'}</div><h3>${esc(a.name)}${l.acted[a.id]?' · already acted':''}</h3>
    ${actions}${((enemy&&d.enemyEffect==='context')||(!enemy&&d.action==='improvise'&&d.effect==='context'))?contextSelect(d):''}${enemyEffect}${target}${splitTargets}${improvise}${combatObjectiveDraftFields(d)}${destination}${describe}${stakes}${attackPickers}${sheet}
    ${blocked.length?`<p class="lt-warning">${esc(blockedName)} needs ${esc(blocked.join(', '))} first. <button class="btn sm" data-act="lt-stats" data-id="${esc(enemy?a.id:t.id)}">Add numbers</button></p>`:''}
    ${edge?`<p class="lt-tip">${l.openings[roller.id]?'An ally created an opening':'An ally is covering this hero'}: roll two fair d20s on the first roll, keep the higher. At the table, enter both like 3/17.</p>`:''}
    <div class="lt-roll-controls"><button class="btn primary" data-act="lt-roll" ${canAct&&!blocked.length?'':'disabled'}>${enemy?`Roll defense${n>1?' ×'+n:''} · public`:`Roll ${n>1?n+' d20s':'d20'} · public`}</button><div class="lt-table"><label for="lt-die">Or enter physical dice${n>1?` (${n}, in order)`:''}:</label><div class="row"><input id="lt-die" type="text" inputmode="numeric" data-bind="combat.lite.draft.die" value="${esc(d.die)}" placeholder="${n>1?Array.from({length:n},(_,i)=>12-i*3).join(' '):'12'}" aria-label="Table d20 results"><button class="btn" data-act="lt-table" ${canAct&&!blocked.length?'':'disabled'}>Use roll</button></div></div></div>
    ${l.acted[a.id]?'<p class="small muted">Choose a ready character or start the next round.</p>':`<button class="btn sm ghost" data-act="co-table-action" ${canAct?'':'disabled'}>Record an action resolved at the table…</button>`}
    <p class="small muted">${enemy?'Natural 20 always avoids; natural 1 is a critical hit.':d.action==='attack'?'Natural 20 doubles damage dice; a natural 1 can trigger a critical strike-back if it is the first eligible graze or miss.':'Natural 1 / 20 always count. Otherwise: 15+ success · 8–14 success with a consequence · 7 or less setback.'}</p></section>`;
}
const ATTACK_LABEL={crit:'Critical hit: damage dice double',success:'Hit',mixed:'Graze: half damage',setback:'Miss',disaster:'Natural 1: miss'};
const DEFENSE_LABEL={crit:'Natural 20: avoided, with a bonus',success:'Avoided',setback:'Hit',disaster:'Natural 1: critical hit'};
function combatResult(){
  const l=Stakes.init(S), p=l.pending, enemy=p.mode==='enemy', a=Stakes.actor(S,p.actor), t=Stakes.actor(S,p.target), attack=!enemy&&p.action==='attack', dealsDamage=!enemy&&(attack||p.effect==='damage'), responseIndex=attack?Stakes.attackResponseIndex(S,p):-1;
  const rows=p.rolls.map((r,i)=>{
    const head=`<div class="lt-die ${r.die===20?'critical':r.die===1?'disaster':''}">${r.die}</div><div><b>${esc(enemy?DEFENSE_LABEL[r.band]:attack?ATTACK_LABEL[r.band]:BAND_LABEL[r.band])}</b>${p.rolls.length>1?` <span class="small muted">· ${enemy?esc(r.attack):esc(r.attack)+' · attack '+(i+1)}</span>`:''}
      <p class="small">${r.dice.length>1?r.dice.join(' / ')+' → ':''}d20 ${r.die} ${fmt(r.bonus)}${r.push?` + d4 ${r.push.d4}`:''} = <b>${r.total}</b>${enemy?` · needs ${r.against}+`:attack?` · AC ${r.against}`:''}</p>`;
    const info=!enemy?Stakes.pushInfo(S,i):{ok:false};
    const push=info.ok?`<button class="btn sm" data-act="lt-push" data-i="${i}">Push +1d4 · ${info.pay==='stamina'?`1 stamina (${info.left} left)`:`Winded: overexert, 1 Hit Die (${info.left} left)`}</button>`:'';
    const lands=['crit','success','mixed'].includes(r.band);
    const dmg=dealsDamage&&lands?`<div class="row lt-dmg"><label class="f">Damage${r.band==='crit'?' (dice doubled)':''}${r.band==='mixed'&&attack?' (the target takes half)':''}<input type="number" min="0" max="999" step="1" data-bind="combat.lite.pending.rolls.${i}.damage" value="${r.damage??''}" placeholder="${esc(r.expr)}"></label><button class="btn sm" data-act="lt-dmg" data-i="${i}">Reroll damage</button><span class="small muted">Auto-rolled damage; edit for table dice.</span></div>`:'';
    const strike=attack&&responseIndex===i?`<div class="lt-strike"><label><input type="checkbox" data-bind="combat.lite.pending.rolls.${i}.strike.reach" data-rerender ${r.strike.reach?'checked':''}> ${esc(Stakes.actor(S,r.target)?.name||'The target')} can reach and strikes back with ${esc(r.strike.name)}</label>${r.strike.reach?`<label class="f">Strike-back damage${r.band==='disaster'?' (critical)':''}<input type="number" min="0" max="999" step="1" data-bind="combat.lite.pending.rolls.${i}.strike.damage" value="${r.strike.damage}"></label>`:''}</div>`:'';
    const hit=enemy&&p.enemyEffect==='damage'&&!['crit','success'].includes(r.band)?`<label class="f">Damage to ${esc(Stakes.actor(S,r.target)?.name||'the hero')}${r.band==='disaster'?' (critical)':''}<input type="number" min="0" max="999" step="1" data-bind="combat.lite.pending.rolls.${i}.damage" value="${r.damage}"></label>`:'';
    return `<div class="lt-rollrow ${r.band}">${head}${dmg}${strike}${hit}${push}</div></div>`;
  }).join('');
  const bad=['mixed','setback','disaster'].includes(p.band), disaster=attack&&responseIndex>=0?p.rolls[responseIndex].band==='disaster':p.band==='disaster';
  const unreachable=attack&&responseIndex>=0&&!p.rolls[responseIndex].strike.reach;
  const foes=S.combat.foes.filter(f=>Stakes.active(S,f)&&!Stakes.needs(S,f).length);
  const consequences=(!enemy&&!attack&&bad)||unreachable?`<div class="lt-consequences"><label class="f">${disaster?'Choose a major reversal':'Choose the consequence'}<select data-bind="combat.lite.pending.consequence" data-rerender>
      <option value="position" ${p.consequence==='position'?'selected':''}>${disaster?'Separated and pinned in open ground':'Lose position and become Exposed'}</option>
      ${!attack&&foes.length?`<option value="strike" ${p.consequence==='strike'?'selected':''}>${disaster?'An enemy lands a critical strike':'An enemy strikes'}</option>`:''}
      <option value="goal" ${p.consequence==='goal'?'selected':''}>${disaster?'The enemy achieves a major goal':p.stakes?'What was at risk happens':'The scene changes against you'}</option></select></label>
    ${p.consequence==='goal'?`<label class="f">What changes?<textarea data-bind="combat.lite.pending.consequenceText" rows="2">${esc(p.consequenceText)}</textarea></label>`:''}
    ${p.consequence==='strike'&&!attack?`<label class="f">Which enemy?<select data-bind="combat.lite.pending.striker">${foes.map(f=>`<option value="${esc(f.id)}" ${p.striker===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label class="f">Damage (leave empty to roll its attack)<input type="number" min="0" max="999" step="1" data-bind="combat.lite.pending.strikeDamage" value="${p.strikeDamage??''}"></label>`:''}</div>`:'';
  const crit=p.rolls.some(r=>r.band==='crit')&&!dealsDamage;
  const reward=crit?`<div class="lt-reward"><label class="f">Choose your extra benefit<select data-bind="combat.lite.pending.reward" data-rerender><option value="opening" ${p.reward==='opening'?'selected':''}>Give a hero an opening</option><option value="protect" ${p.reward==='protect'?'selected':''}>Cover a hero (opening on their next defense)</option><option value="move" ${p.reward==='move'?'selected':''}>Seize better ground</option></select></label>
    ${['opening','protect'].includes(p.reward)?`<label class="f">Who benefits?<select data-bind="combat.lite.pending.rewardTarget">${S.party.filter(h=>Stakes.active(S,h)).map(h=>`<option value="${esc(h.id)}" ${p.rewardTarget===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label>`:p.reward==='move'?zoneSelect('combat.lite.pending.destination',p.destination):''}</div>`:'';
  const effect=enemy?(p.enemyEffect!=='damage'?`If the defense fails: ${p.enemyOutcome}`:`${a.name} attacks ${t?.name}.`)
    :attack?`${a.name} attacks ${t?.name}.`:['crit','success','mixed'].includes(p.band)?(p.action==='defend'?`${t?.name} is covered: an opening on their next defense roll.`:p.action==='help'?`Give ${t?.name} an opening.`:p.action==='move'?`Reach ${l.zones[p.destination]}.`:p.intent):'Your intent does not land. The opposition changes the situation.';
  return `<section class="lt-result ${p.band}" aria-live="polite"><div class="eyebrow">2 · Resolve the roll</div><p class="lt-intent">${esc(effect)}</p>
    ${p.stakes&&!enemy?`<p class="small"><b>At risk:</b> ${esc(p.stakes)}</p>`:''}
    <div class="lt-rolls">${rows}</div>
    ${consequences}${reward}${Stakes.contextPreview(p)?`<p><b>Automatic condition:</b> ${esc(Stakes.contextPreview(p).add||'Clear '+Stakes.contextPreview(p).remove.join(' / '))}. ${esc(Stakes.contextPreview(p).reason)}</p>`:''}${!enemy&&p.action==='move'&&p.destination==='cover'&&['crit','success','mixed'].includes(p.band)&&l.conditions[p.actor].includes('Exposed')?`<label><input type="checkbox" data-bind="combat.lite.pending.clearExposure" ${p.clearExposure?'checked':''}> DM judgment: this cover provides safety; clear Exposed if the character remains here after consequences.</label>`:''}
    ${p.cost.stamina||p.cost.hd?`<p class="small">On confirm, ${esc(a.name)} spends ${[p.cost.stamina&&p.cost.stamina+' stamina',p.cost.hd&&p.cost.hd+' Hit Die'].filter(Boolean).join(' and ')}.</p>`:''}
    ${combatObjectiveResult(p)}<div class="row"><button class="btn primary" data-act="lt-confirm">Confirm result</button><button class="btn ghost" data-act="lt-cancel">Cancel roll</button></div><p class="small muted">Nothing changes until you confirm, and a cancelled push costs nothing. Undo can reverse a confirmed result.</p></section>`;
}
// Outside a fight: the party's HP, stamina and Hit Dice, and the two rests.
function partyRest(){
  return `<section class="card stack" style="margin-top:18px"><h3>The party</h3>${S.party.map(p=>`<p><b>${esc(p.name)}</b> · HP ${p.hpNow}/${p.hp} · Stamina ${p.stamina}/${Stakes.staminaMax(p)} · Hit Dice ${p.hitDice?.left??0}/${p.level||1}${p.dead?' · dead':p.hpNow<=0?' · unconscious at 0 HP':''}</p>`).join('')}
    <div class="row"><button class="btn" data-act="rest-short">Short rest…</button><button class="btn" data-act="rest-long">Long rest</button></div><p class="small muted">A short rest spends Hit Dice to heal. A long rest restores HP, all Hit Dice and stamina.</p></section>`;
}
function vCombat(){
  const c=S.combat;
  if(!c) return `<div class="pagehead"><div><div class="eyebrow">Stakes combat</div><h2>No fight running</h2><p>Prepare a fight on the DM desk, then choose Start this fight.</p></div></div><button class="btn primary" data-act="tab" data-v="desk">DM desk</button>${partyRest()}`;
  combatSettle();
  const l=c.lite, actors=[...S.party,...c.foes], ready=actors.filter(a=>Stakes.active(S,a)&&!l.acted[a.id]);
  const dying=S.party.filter(p=>p.hpNow<=0&&!p.dead&&!p.dying?.stable);
  const hint=l.pending?['Next: confirm the result','Enter or roll damage for each hit, then choose Confirm result. Nothing is applied until then. The dice themselves are already public.']
    :Object.keys(l.breaking).length?['Next: an enemy is wavering','Decide on its card whether it flees, surrenders, makes a deal or fights on.']
    :dying.length?['A hero is dying',`${dying.map(p=>p.name).join(', ')} at 0 HP: roll a death save on their turn, or heal them.`]
    :['Next: choose who acts','Choose who acts, choose an action, say what is at risk, then roll. Bonuses come from the sheet and the stat block.'];
  return `${clHint(hint[0],hint[1])}
  <div class="pagehead lt-heading"><div><div class="eyebrow">Stakes combat · round ${c.round}</div><h2>${esc(c.name)}</h2>${c.goal?`<p><b>They want:</b> ${esc(c.goal)}</p>`:'<p>Pick a token. Choose an action. Let the die decide.</p>'}</div>
    <div class="row"><button class="btn" data-act="lt-undo" ${l.history.length?'':'disabled'}>↶ Undo</button><button class="btn" data-act="lt-round" ${l.pending?'disabled':''}>Next round</button><button class="btn ghost" data-act="c-end">End fight</button></div></div>
  <div class="row hd-controls"><button class="btn sm" data-act="hd-guide">Conditions guide</button><button class="btn sm" data-act="hd-secret">DM secret roll</button><button class="btn sm" data-act="co-edit" ${l.pending?'disabled':''}>Prepare objective…</button></div>
  <div class="lt-layout"><div class="lt-stage">
    <div class="lt-scenehead"><span class="eyebrow">The scene · ${esc(c.where||'')}</span><button class="btn sm ghost" data-act="lt-zones" ${l.pending?'disabled':''}>Name areas</button></div>
    <div class="lt-board">${Stakes.zones.map(z=>`<section class="lt-zone" data-zone="${z}" aria-label="${esc(l.zones[z])}"><h3>${esc(l.zones[z])}</h3><div class="lt-zone-body">${zoneTokens(actors.filter(a=>l.positions[a.id]===z))||'<p class="small muted">Drop a token here</p>'}</div></section>`).join('')}</div>
    <p class="lt-boardhint">Drag tokens to arrange the scene. Or use <b>Place selected token</b> below. Free placement is a DM adjustment; choose Move for a risky action.</p>
    <div class="lt-placement"><span class="small">Place selected token:</span>${Stakes.zones.map(z=>`<button class="btn sm" data-act="lt-place" data-v="${z}" ${l.pending?'disabled':''}>${esc(l.zones[z])}</button>`).join('')}</div>
    <div class="lt-turnstrip"><span class="eyebrow">${Stakes.encounterStatus(S).phase==="cleared"?"No enemies still fighting":Stakes.encounterStatus(S).phase==="party-down"?"All heroes down":"Still to act"}</span>${ready.length?ready.map(a=>`<button class="chip" data-act="lt-pick" data-id="${esc(a.id)}" ${l.pending?'disabled':''}>${esc(a.name)}</button>`).join(''):'<span>Everyone has acted. Ready for the next round.</span>'}</div>
    ${combatObjectivesView()}
    <details class="lt-rules"><summary>The rules in one minute</summary>
      <p>Say what you do, and what's at risk if it goes wrong. Then roll a d20. A natural 20 and a natural 1 always count.</p>
      <p><b>Attack:</b> d20 + your attack bonus against the target’s armor class. Reach it and you hit for your normal damage. Miss by 5 or less and it’s a graze: half damage. The first eligible graze or miss while the enemy is standing may trigger one strike-back for the whole Attack action, unless it can't reach you. Extra Attack means one roll per attack.</p>
      <p><b>Defending:</b> when an enemy acts, the hero rolls d20 + armor class − 10 and must beat 11 + the enemy’s attack bonus. These are exactly 5e’s chances. Damage comes from the stat block.</p>
      <p><b>Stamina:</b> after seeing your own roll, spend 1 stamina to add 1d4. Stamina equals your proficiency bonus and comes back on a long rest. When it runs out you are Winded and can still push by spending a Hit Die instead.</p>
      <p><b>Other actions</b> (Help, Defend, Move, Improvise): 15+ succeeds, 8–14 succeeds with a consequence, 7 or less is a setback. Defend gives an ally an opening on their next defense roll; Help gives an opening on their next roll.</p>
      <p><b>Hit points:</b> at 0 HP a hero is dying and makes death saves; an enemy is out. Enemies waver at their breaking point (15–30% of their HP, tougher ones hold out longer; a group when half of it is down) and the DM decides whether they flee, surrender, make a deal or fight on.</p>
      <p>Conditions change what is possible. Resolve a condition with × when the story allows it. Spell slots and limited features stay on your sheet; Stakes is still being playtested and is not a complete conversion of every 5e feature.</p></details>
    <details class="lt-log"><summary>Recent actions · ${c.log.length}</summary>${c.log.slice(0,15).map(x=>`<p>${esc(x.text)}</p>`).join('')}</details></div>
    <aside class="lt-panel">${l.uiError?`<div class="cl-error" role="alert">${esc(l.uiError)}</div>`:''}${l.pending?combatResult():combatComposer()}</aside></div>
  <datalist id="lt-conditions">${['Disarmed','Pinned','Exposed','Distracted','Hidden','Separated','Spell interrupted'].map(x=>`<option value="${x}">`).join('')}</datalist>`;
}
Object.assign(ACT,{
  'lt-pick':d=>combatPick(d.id),
  'lt-action':d=>{const l=Stakes.init(S); l.draft.action=d.v; l.draft.target=''; l.draft.targets=[]; combatSettle();},
  'lt-roll':()=>combatRoll(false), 'lt-table':()=>combatRoll(true),
  'lt-confirm':()=>combatRun(()=>Stakes.apply(S)),
  'lt-cancel':()=>{S.combat.lite.pending=null;},
  'lt-undo':()=>combatRun(()=>Stakes.undo(S)),
  'lt-push':d=>combatRun(()=>Stakes.push(S,+d.i)),
  'lt-dmg':d=>combatRun(()=>Stakes.damage(S,+d.i)),
  'lt-round':()=>{const l=Stakes.init(S); const ready=[...S.party,...S.combat.foes].filter(a=>Stakes.active(S,a)&&!l.acted[a.id]);
    if(ready.length){ const dlg=openDialog('Start the next round?',`<p>${esc(ready.map(a=>a.name).join(', '))} can still act. Start a new round anyway?</p><button class="btn primary" id="round-confirm">Start next round</button>`); dlg.querySelector('#round-confirm').onclick=()=>{combatRun(()=>Stakes.nextRound(S)); dlg.close(); render();}; }
    else combatRun(()=>Stakes.nextRound(S));},
  'lt-place':d=>combatRun(()=>Stakes.move(S,S.combat.lite.draft.actor,d.v)),
  'lt-hurt':d=>{const a=Stakes.actor(S,d.id); const dlg=openDialog('Change hit points',`<p>${esc(a.name)}: ${Stakes.hero(S,a.id)?a.hpNow+' / '+a.hp:a.hpNow+' / '+a.hpMax} HP. Use this for healing, potions, spells and corrections. Undo can reverse it.</p><label class="f">How many hit points?<input id="hp-amount" type="number" min="1" max="999" step="1" inputmode="numeric"></label><div class="row"><button class="btn" id="hp-damage">Damage</button><button class="btn primary" id="hp-heal">Heal</button></div>`);
    const go=sign=>{const n=Math.round(Number(dlg.querySelector('#hp-amount').value)); if(!(n>0)){toast('Enter a whole number above 0.');return;} combatRun(()=>Stakes.adjust(S,d.id,sign*n)); dlg.close(); render();};
    dlg.querySelector('#hp-damage').onclick=()=>go(-1); dlg.querySelector('#hp-heal').onclick=()=>go(1);},
  'lt-stats':d=>{const f=Stakes.actor(S,d.id),atk=(f.attacks||[])[0],sug=QBAttacks.suggestFor(f.crNum); const dlg=openDialog('Enemy numbers',`<p>${esc(f.name)} has no full stat block yet. Enter the numbers from its card or book. They stay on the DM side.</p>
      ${sug?`<p class="lt-tip">Typical for challenge rating ${esc(f.crNum)} (the middle of ${sug.from} SRD monsters): HP ${sug.hpMax}, AC ${sug.acNum}, attack ${fmt(sug.attack.bonus)} for ${esc(sug.attack.damage)}. Only a suggestion: the card’s own numbers are better. <button class="btn sm" id="st-suggest">Use these</button></p>`:''}
      <label class="f">Hit points<input id="st-hp" type="number" min="1" step="1" value="${f.hpMax??''}"></label><label class="f">Armor class<input id="st-ac" type="number" min="1" step="1" value="${f.acNum??''}"></label>
      <label class="f">Attack name<input id="st-name" maxlength="60" value="${esc(atk?.name||'Attack')}"></label><label class="f">Attack bonus<input id="st-bonus" type="number" step="1" value="${atk?.bonus??''}" placeholder="4"></label><label class="f">Damage<input id="st-dmg" value="${esc(atk?.damage||'')}" placeholder="1d6+2"></label>
      <button class="btn primary" id="st-save">Save numbers</button>`);
    if(sug) dlg.querySelector('#st-suggest').onclick=()=>{const set=(id,x)=>{const i=dlg.querySelector(id); if(!i.value.trim()) i.value=x;}; set('#st-hp',sug.hpMax); set('#st-ac',sug.acNum); set('#st-bonus',sug.attack.bonus); set('#st-dmg',sug.attack.damage);};
    dlg.querySelector('#st-save').onclick=()=>{const v=id=>dlg.querySelector(id).value.trim(); const st={}; if(v('#st-hp'))st.hpMax=v('#st-hp'); if(v('#st-ac'))st.acNum=v('#st-ac'); if(v('#st-bonus')&&v('#st-dmg'))st.attack={name:v('#st-name'),bonus:v('#st-bonus'),damage:v('#st-dmg')};

/* ---------- player screen integration ---------- */
/* DM controls. The player feed contains explicit public fields only. */
let playerSpotlight = null;
let playerChannel = null;
let playerLastPayload = '';
const playerPublisherId=uid('display');
function playerSettings() {
  if (!S.playerSettings) S.playerSettings = { token: '', party: false, combat: false };
  if (!/^[a-f0-9]{32}$/.test(S.playerSettings.token)) S.playerSettings.token = Array.from(crypto.getRandomValues(new Uint8Array(16)), x => x.toString(16).padStart(2,'0')).join('');
  return S.playerSettings;
}
function playerConnect() {
  const cfg = playerSettings();
  if (!window.BroadcastChannel || playerChannel?.token === cfg.token) return;
  playerChannel?.channel.close();
  const channel = new BroadcastChannel('quillbound-player-' + cfg.token);
  playerChannel = { channel, token: cfg.token };
  channel.onmessage = e => { if (e.data?.type === 'hello' && (!e.data.sourceId || e.data.sourceId===playerPublisherId)) publishPlayer(true); };
}
function playerClaim(){if(S.role!=='dm')return;playerConnect();playerChannel?.channel.postMessage({type:'source-activate',sourceId:playerPublisherId});publishPlayer(true);}
function publishPlayer(force = false) {
  if(S.role!=='dm')return;
  playerConnect();
  const data = PlayerFeed.snapshot(S, playerSpotlight);
  livePublish(data);
  // Ignore the timestamp when comparing so typing private notes sends nothing new.
  const key = JSON.stringify({ ...data, updated: 0 });
  if (force || key !== playerLastPayload) { playerLastPayload = key; playerChannel?.channel.postMessage({ type: 'snapshot', sourceId:playerPublisherId, payload: data }); }
}
function eye(kind, record) {
  const visible = record.player?.visible === true;
  return `<button class="btn sm ${visible?'primary':''}" data-act="player-edit" data-kind="${esc(kind)}" data-id="${esc(record.id)}" aria-label="${visible?'Edit or hide':'Reveal'} ${esc(record.title||record.name||'lead')}" title="Review what players see">${visible?'Shown · edit':'Reveal…'}</button>`;
}
// The app's one dialog. Buttons inside can use data-act (handled like the rest of the page)
// or be wired by the caller through the returned element. Escape and Close both close it.
function openDialog(title, body, { wide = false } = {}) {
  document.getElementById('app-dialog')?.remove();
  const dlg = document.createElement('dialog'); dlg.id = 'app-dialog'; dlg.className = 'dialog' + (wide ? ' wide' : '');
  dlg.innerHTML = `<div class="stack"><div class="dialog-h"><h3>${esc(title)}</h3><button type="button" class="btn sm ghost" data-dialog-close>Close</button></div>${body}</div>`;
  document.body.append(dlg); dlg.querySelector('[data-dialog-close]').onclick = () => dlg.close();
  dlg.addEventListener('close', () => dlg.remove()); dlg.showModal(); return dlg;
}

  const dlg = openDialog('Player screen', `<p>Open a second window for your table or TV. Keep it in the same browser and keep this DM page open. Reveals update live.</p>
    <a class="btn primary" id="player-open" href="player.html?v=single-source2&source=${playerPublisherId}#${cfg.token}" target="_blank" rel="noopener">Open player screen</a><p class="small muted">This is a presentation screen on your computer. It does not provide accounts or access control for remote players.</p>
    <button class="btn" id="player-use-tab">Use this DM tab for the player screen</button><p class="small muted">The player display follows one DM tab. Use this button if another open tab was showing a different scene.</p><label><input id="share-party" type="checkbox" ${cfg.party?'checked':''}> Show party names, classes and current conditions</label>

function playerEdit(kind, id) {
  if (!['beats','hooks','npcs','items'].includes(kind)) return;
  const record = S[kind].find(x => x.id === id); if (!record) return;
  const shared = record.player || {};
  const source = kind==='beats' ? record.summary : kind==='hooks' ? record.text : kind==='npcs' ? [record.role,record.look].filter(Boolean).join('\n') : record.desc;
  const title = shared.title ?? (record.title || record.name || 'A lead');
  const dlg = openDialog('Review before revealing', `<p>Only the title and text below are shared. Keep secrets and solutions out of this card.</p>
    <details><summary>Reference from the DM desk (private)</summary><p style="white-space:pre-wrap">${esc(source||'No description')}</p></details>
    <label class="f">Player-facing title<input id="public-title" maxlength="200" value="${esc(title)}"></label>
    <label class="f">Text players can see<textarea id="public-text" rows="6" maxlength="20000" placeholder="Write what the party has learned…">${esc(shared.text||'')}</textarea></label>
    <p class="small muted">Secrets, motives and roleplay notes from People are never added automatically.</p><div class="row"><button class="btn primary" id="reveal-save">Show players</button><button class="btn" id="reveal-hide">Hide card</button></div>`);
  dlg.querySelector('#reveal-save').onclick=()=>{const name=dlg.querySelector('#public-title').value.trim(); if(!name){dlg.querySelector('#public-title').focus();return;} record.player={visible:true,title:name,text:dlg.querySelector('#public-text').value};dlg.close();render();toast('Player screen updated');};
  dlg.querySelector('#reveal-hide').onclick=()=>{record.player={...shared,visible:false};dlg.close();render();};
}
function playerReadAloud(id) {
  const mapTicket = sceneMapsPause();

async function playerMap(path) {
  const mapTicket = sceneMapsPause();
  try {
    if(!window.QB) throw new Error('The importer is still loading. Try again in a moment.');
    const image = await QB.blobFor(S.importer.pi,path);
    const url = await QB.previewUrl(S.importer.pi,path);
    const dlg=openDialog(image.dm?'Review DM map before showing':'Review map or handout', `${image.dm?'<p><b>This is labeled as a DM version. Its labels and secrets will be visible.</b></p>':'<p>Check this image for labels or secrets before showing it.</p>'}<img alt="Preview before revealing" src="${esc(url)}" style="max-width:100%;max-height:45vh;object-fit:contain"><label class="f">Player-facing title<input id="map-title" value="Map or handout" maxlength="200"></label><button class="btn primary" id="map-confirm">Show this image to players</button>`);
    dlg.querySelector('#map-confirm').onclick=async e=>{
      e.target.disabled=true;
      try {
        // Re-encode pixels: a bounded PNG contains no filename, PDF or image metadata.
        const bitmap=await createImageBitmap(image.blob); const scale=Math.min(1,2400/Math.max(bitmap.width,bitmap.height));
        const canvas=document.createElement('canvas'); canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
        canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height); bitmap.close();
        if(!sceneMapsCurrent(mapTicket))return;
        playerSpotlight={type:'image',title:dlg.querySelector('#map-title').value,url:canvas.toDataURL('image/png')};publishPlayer(true);dlg.close();toast('Image shown on player screen');
      }catch(error){e.target.disabled=false;toast('Could not display this image: '+error.message);}
    };
  }catch(error){toast(error.message);}
}

function render(){

  const heroDisclosures=heroDisclosureCapture();
  sceneMapsSync();
  publishPlayer();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===S.tab));
  cmShell(); // player or DM mode (src/ui/campaigns.js)
  $('#view').innerHTML={home:S.role==='dm'?vHome:vPlayerHome,create:vCreate,heroes:vHeroes,campaigns:vCampaigns,import:vImport,desk:vDesk,combat:vCombat,homebrew:vHomebrew}[S.tab]();

  liveRestore(liveState);

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const fn=ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(el.dataset,el); render();
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('span[data-act]')){e.preventDefault();e.target.click();}
  if(e.key==='Enter'&&e.target.id==='hook-new'){ACT['hook-add']();render();}
});
document.addEventListener('input',e=>{
  const t=e.target, b=t.dataset.bind; if(!b) return;
  setPath(b,t.type==='checkbox'?t.checked:t.value);
  if(t.dataset.rerender!==undefined) render(); else save();
  if(b.startsWith('creator.')&&S.creator.step===2){const nb=document.querySelector('.cr-foot .btn.primary'); if(nb) nb.disabled=!S.creator.name.trim(); const st=document.querySelectorAll('.stepper button')[4]; if(st) st.disabled=!S.creator.name.trim();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.actChange==='hook-status'){ const h=S.hooks.find(x=>x.id===t.dataset.id); h.status=t.value; render(); }
  else if(t.dataset.actChange&&ACT[t.dataset.actChange]){ ACT[t.dataset.actChange]({...t.dataset,v:t.value},t); render(); }
  if((t.id==='lib-files'||t.id==='lib-folder')&&t.files.length) libAddFiles(t.files);
  if(t.id==='hb-file'&&t.files.length){ hbImportFile(t.files[0]); t.value=''; }
});

 dlg.querySelector('#rd-save').onclick=async()=>{try{const res=await fetch(a.path);if(!res.ok)throw Error('Image could not be loaded.');const bitmap=await createImageBitmap(await res.blob()),scale=Math.min(1,2400/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();if(!sceneMapsCurrent(mapTicket))return;playerSpotlight={type:'image',title:rdValue(dlg,'rd-asset-title'),url:canvas.toDataURL('image/png')};publishPlayer(true);dlg.close();}catch(e){toast(e.message);}};
};

S=load()||fresh();
// This table's homebrew ships with the app (src/app/table-homebrew.js): add it once per browser, approved, skipping names this browser already has.
// A newer shipped version of an item (its "version") replaces the copy this browser got earlier; approval stays as the DM left it.
(function(){ const T=globalThis.QB_TABLE_HOMEBREW; if(!T) return; const hb=hbState(); hb.seeded??=[]; if(hb.seeded.includes(T.id)) return;
  for(const k of ['backgrounds','species','classes']) for(const x of T[k]||[]){ const copy={...JSON.parse(JSON.stringify(x)),updated:Date.now()}, i=hb[k].findIndex(y=>y.id===x.id);
    if(i>=0){ if((hb[k][i].version||1)<(x.version||1)) hb[k][i]={...copy,approved:hb[k][i].approved}; }
    else if(!hb[k].some(y=>String(y.name).trim().toLowerCase()===x.name.toLowerCase())) hb[k].push(copy); }
  hb.seeded.push(T.id); save(); })();
cmInit(); // everyone starts in player mode; the save becomes the first campaign
delete S.modal; // older saves kept the previous popup here
// file handles don't survive a reload: keep read results, but the library has to be dropped again
Object.assign(S.importer,{busy:false,status:''});
if(S.importer.lib){ S.importer.lib=null; if(S.importer.phase==='product') S.importer.phase='library'; }
render();
