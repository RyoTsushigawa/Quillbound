<title>Quillbound</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="clarity.css">
<link rel="stylesheet" href="creator.css">
<link rel="stylesheet" href="combat.css">
<link rel="stylesheet" href="drama.css">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a graph-paper "DM's desk". Sticky header with the four tools; each tool is a 2–3 column working surface that stacks on phones. */
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.55rem;font-weight:700;letter-spacing:.01em}
.brand svg{width:26px;height:26px;color:var(--accent)}
.proto{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid currentColor;border-radius:3px;padding:1px 5px;font-weight:600}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap}
@media (max-width:640px){ .tabs{order:3;flex-basis:100%} }
.tab{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:5px;cursor:pointer;display:flex;align-items:baseline;gap:7px}
.tab .n{font-family:var(--mono);font-size:.7rem;opacity:.8}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
main{padding-block:22px 56px}

/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{font:inherit;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2;text-align:left}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.discord{border-style:dashed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:58px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
button.chip{cursor:pointer;font-family:inherit}
button.chip:hover{border-color:var(--accent)}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.why{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);text-align:center;font-size:.92rem}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{max-width:62ch;color:var(--muted);margin-top:6px}

/* creator */
.stepper{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;counter-reset:s}
.stepper button{font:inherit;font-size:.9rem;background:none;border:1px solid transparent;border-radius:99px;padding:4px 12px 4px 6px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px}
.stepper button::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:.72rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.stepper button[aria-current="step"]{color:var(--ink);border-color:var(--line);background:var(--surface)}
.stepper button[aria-current="step"]::before{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper button.done::before{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.stepper button:disabled{cursor:default;opacity:.55}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.choice{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice .pitch{font-family:var(--display);font-size:1.18rem;line-height:1.15;font-weight:600}
.choice .meta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.choice .cls{font-weight:700}
.choice .desc{font-size:.9rem;color:var(--muted)}
.cr-foot{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.prompts{display:grid;gap:16px;max-width:760px}
.abil-table{display:grid;gap:6px;max-width:820px}
.abil{font:inherit;color:inherit;display:grid;grid-template-columns:52px 54px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer}
.abil:hover{border-color:var(--accent)}
.abil[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.abil .score{font-family:var(--mono);font-size:1.5rem;font-weight:600;text-align:center}
.abil .mod{font-family:var(--mono);font-size:.95rem;color:var(--accent);font-weight:600}
.abil .what b{display:block}
.abil .what span{font-size:.86rem;color:var(--muted)}
.bar{height:6px;width:90px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.sheet{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.sheet .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:5px;padding:8px;text-align:center;background:var(--surface-2)}
.stat b{display:block;font-family:var(--mono);font-size:1.3rem}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.abils6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.abils6 div{text-align:center;border:1px solid var(--line);border-radius:5px;padding:6px 2px}
.abils6 b{display:block;font-family:var(--mono)}
.abils6 small{display:block;font-size:.7rem;color:var(--muted)}
.list{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.anchor{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}

/* importer */
.imp{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.drop{display:grid;place-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:var(--r);padding:22px 12px;cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--display);font-size:1.2rem}
.mode{display:grid;gap:8px}
.mode label{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;border:1px solid var(--line);border-radius:5px;padding:9px;font-size:.9rem;align-items:start}
.mode label.off{opacity:.65}
.mode label span{font-size:.82rem;color:var(--muted);grid-column:2}
.readout{font-family:var(--mono);font-size:.78rem;display:grid;gap:3px;color:var(--muted)}
.readout b{color:var(--ink);font-weight:600}
.rtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.rtab{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:baseline;margin-bottom:-1px}
.rtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rtab .n{font-family:var(--mono);font-size:.75rem}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.res{display:grid;gap:6px;align-content:start}
.res.out{opacity:.5}
.res-top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.res-top label{display:flex;gap:7px;align-items:baseline;font-weight:700;font-size:1.02rem;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.88rem}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0}
.send{position:sticky;bottom:0;margin-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}

/* library */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.prod .pitch{font-size:1.25rem}
.grp{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-top:0}
.frow{display:grid;grid-template-columns:16px minmax(0,1fr) auto auto auto;gap:4px 10px;align-items:center;font-size:.9rem;padding:3px 0}
.frow .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .star{color:var(--gold);font-weight:700}
.frow.copy{opacity:.55}
.frow .row{flex-wrap:wrap}
.rt{width:100%;border-collapse:collapse;font-size:.85rem}
.rt td{border-top:1px solid var(--line);padding:3px 6px;vertical-align:top}
.rt td:first-child{white-space:nowrap;color:var(--accent);font-weight:600}
@media (max-width:640px){ .frow{grid-template-columns:16px minmax(0,1fr) auto} .frow>.row,.frow>.mono{grid-column:2 / -1} }

/* campaign */
.seg2{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
.seg2 .rtab{border:0;border-radius:4px;margin:0;padding:5px 12px}
.seg2 .rtab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.camp{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.advrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.advrow:first-of-type{border-top:0}
.arcstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0}
.arcnum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600}
.lvlbar{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:6px 0;max-width:420px}
.lvlbar i{height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.lvlbar i.on{background:var(--accent);border-color:var(--accent)}
.lvlbar.unknown{display:block;font-size:.8rem;color:var(--muted)}
.bridge{margin:0 0 0 15px;padding:8px 0 8px 24px;border-left:2px dashed var(--line);display:grid;gap:6px}
.thread{background:var(--surface-2);border-radius:5px;padding:8px 10px;display:grid;gap:4px}
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem;padding:4px 0}
@media (max-width:820px){ .camp{grid-template-columns:minmax(0,1fr)} }

/* desk */
.desk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.desk-grid.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);margin-top:14px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.beat{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.beat:first-of-type{border-top:0}
.beat .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);margin-top:3px;cursor:pointer;background:none;padding:0}
.beat.active .dot{border-color:var(--accent);background:var(--accent)}
.beat.done .dot{border-color:var(--muted);background:var(--muted)}
.beat.done h4{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.beat p{font-size:.9rem;color:var(--muted);grid-column:2}
.beat .branches{grid-column:2;font-size:.85rem;display:grid;gap:3px}
.hook{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.hook:first-of-type{border-top:0}
.clock{display:inline-flex;gap:2px;cursor:pointer;background:none;border:0;padding:2px;align-items:center}
.clock i{width:13px;height:13px;border:1.5px solid var(--warn);border-radius:2px}
.clock i.on{background:var(--warn)}
.clock.full i{border-color:var(--bad)}
.clock.full i.on{background:var(--bad)}
.hook select{width:auto;padding:3px 6px;font-size:.85rem}
.npc{border-top:1px solid var(--line);padding:10px 0}
.npc:first-of-type{border-top:0}
.npc button.nm{font:inherit;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left;display:flex;justify-content:space-between;width:100%;gap:8px}
.npc .rp{display:grid;gap:6px;margin-top:8px;font-size:.9rem}
.npc .rp div{display:grid;grid-template-columns:76px 1fr;gap:8px}
.npc .rp dt{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.enc{border:1px solid var(--line);border-radius:5px;padding:12px;display:grid;gap:6px;background:var(--surface-2)}
.encs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.builder{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.builder .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foe-add{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:end}

.quote{font-style:italic;color:var(--muted);font-size:.95rem}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}

/* dialog */
dialog.dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:min(640px,calc(100% - 32px));max-height:85vh;overflow:auto;padding:20px}
dialog.dialog.wide{width:min(1100px,calc(100% - 32px))}
dialog.dialog::backdrop{background:rgba(8,12,16,.55)}
.dialog-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
dialog.dialog img.preview{width:100%;height:auto;border-radius:4px;background:var(--surface-2)}
.dc{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px;font-size:.92rem}
.dc-ch{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.dc-bot{display:flex;gap:8px;align-items:center}
.dc-av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.dc-embed{border-left:3px solid var(--accent);background:var(--surface);border-radius:4px;padding:10px 12px;display:grid;gap:6px;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;z-index:60;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}

@media (max-width:1100px){
  .cb-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
  .cb-log{grid-column:1 / -1}
  .desk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .imp,.cb-grid,.desk-grid,.desk-grid.two,.sheet{grid-template-columns:minmax(0,1fr)}
  .abil{grid-template-columns:44px 44px 1fr}
  .abil .bar{display:none}
  .builder .g{grid-template-columns:1fr}
}
@media (max-width:520px){
  .seg{grid-template-columns:1fr}
  .seg.six{grid-template-columns:1fr 1fr}
  .abils6{grid-template-columns:repeat(3,1fr)}
  .sheet .stats{grid-template-columns:repeat(2,1fr)}
  .rollrow{grid-template-columns:1fr auto}
  .rollrow .or{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .outcome .result{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
}
</style>

  <div class="wrap top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13Z"/><path d="M16 2 9 20h14Z"/><path d="M3 9.5 9 20 3 22.5M29 9.5 23 20l6 2.5M9 20l7 10 7-10"/></svg>

  </div>
</header>

<script>
/* ---------- rules data ---------- */
const ABIL=['STR','DEX','CON','INT','WIS','CHA'];
const APPROACH={
  STR:{name:'Force',plain:'Strength: lifting, shoving, hitting hard'},
  DEX:{name:'Finesse',plain:'Dexterity: quick, quiet, precise'},
  CON:{name:'Endure',plain:'Constitution: toughness, holding on'},
  INT:{name:'Know',plain:'Intelligence: memory, reasoning, magic theory'},
  WIS:{name:'Notice',plain:'Wisdom: awareness, instinct, reading people'},
  CHA:{name:'Sway',plain:'Charisma: persuading, scaring, performing'}
};
const mod=s=>Math.floor((s-10)/2);
const fmt=n=>(n>=0?'+':'')+n;

const CLASSES={
  Fighter:{pitch:'Stand in front and keep your friends alive',blurb:'A trained warrior. Hits hard, wears heavy armor, gets back up.',diff:'Easiest',die:10,order:['STR','CON','DEX','WIS','CHA','INT'],ac:a=>16,acNote:'chain mail',trained:['STR','CON'],play:['Step between an enemy and a friend','Use Second Wind when you get hurt','Describe how you fight, not only that you hit']},
  Rogue:{pitch:'Be sneaky, clever and hard to pin down',blurb:'Scout, lockpick and backstabber. Rewards clever ideas.',diff:'Easy',die:8,order:['DEX','CON','CHA','WIS','INT','STR'],ac:a=>11+mod(a.DEX),acNote:'leather armor',trained:['DEX','INT'],play:['Strike when an ally creates an opening (Sneak Attack)','Scout ahead, pick locks, talk past guards','Use Cunning Action to dash or hide']},

const SAMPLE_TEXT=`THE DROWNED LANTERN
A short adventure for three to five characters of 2nd to 4th level.

Adventure Background
Ten years ago the lighthouse of Saltmere went dark during a storm, and the whole fishing fleet was lost on the rocks. Now a green light burns in the empty tower every new moon, and the drowned walk the beach.

Adventure Hooks
- Harbor master Odile Varn offers 50 gp to anyone who can explain the green light at the old lighthouse.
- A drunk fisherman at the Gull & Anchor swears his drowned brother waved at him from the surf.
- A coded letter is found on a smuggler whose body washed ashore. It names "the Keeper" and a date three days from now.

Part 1: Arrival in Saltmere
The characters reach Saltmere at dusk. The town is quiet, the shutters are closed early, and nobody looks at the lighthouse. If the characters ask about the fleet, the locals change the subject. If the characters visit the shrine, Mother Grayle offers them a blessing and a warning.

Characters in Saltmere
Odile Varn, the harbor master, is a stern, tired woman who counts everything twice. She wants the fleet's insurance claim settled before the guild sends an inspector. Secret: she paid the keeper to douse the light so a smuggler ship could land.
Pell Hask, a nervous young fisherman, talks too fast and fidgets with a fishhook necklace. He wants to know what really happened to his brother. He fears the water and will not set foot on a boat.
Mother Grayle, an old cheerful priestess of the sea, hums shanties and answers questions with riddles. She fears the Lantern Society and hides their symbol in her shrine.

Part 2: The Smugglers' Cove
A narrow path leads down the cliffs to a hidden cove where smugglers still unload crates by night. Among the crates the characters find a Scroll of Fog Cloud and a ledger with Odile's signature. If the characters wait until dark, a boat with a green lantern arrives.

Smuggler Lookout
Medium humanoid, neutral
Armor Class 12
Hit Points 11 (2d8 + 2)
Speed 30 ft.
Challenge 1/4 (50 XP)
Shortsword. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 4 (1d6 + 1) piercing damage.
Signal Whistle. The lookout blows a whistle that alerts everyone in the cove.

Part 3: The Old Lighthouse
The tower door is swollen shut and seaweed hangs from the stairs. The green flame at the top is fed by the Lantern Society, who believe it calls the drowned fleet home. If the characters climb the tower quietly, they can overhear the cultists' plan.

Map: The Old Lighthouse
L1. Flooded Ground Floor. Water is knee-deep and something moves beneath it.
L2. Keeper's Quarters. A rotting bed, a logbook, and the keeper's spyglass on a hook.
L3. Lantern Room. A green flame burns in the great lens. Two cultists keep it lit.

Lantern Cultist
Medium humanoid, chaotic neutral
Armor Class 12
Hit Points 9 (2d8)
Speed 30 ft.
Challenge 1/2 (100 XP)
Sickle. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 4 (1d4 + 2) slashing damage.
Green Flame. The cultist hurls a mote of green fire. Each creature within 10 feet must make a DC 11 Dexterity saving throw.

Drowned Keeper
Medium undead, neutral evil
Armor Class 13
Hit Points 45 (7d8 + 14)
Speed 30 ft., swim 30 ft.
Challenge 2 (450 XP)
Undead Fortitude. If damage reduces the keeper to 0 hit points, it can make a Constitution saving throw to drop to 1 hit point instead.
Slam. Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 9 (2d6 + 2) bludgeoning damage.
Drag Under. The keeper grabs a creature in water and pulls it beneath the surface.

Treasure
Keeper's Spyglass (wondrous item, uncommon). While looking through it you can see invisible creatures within 60 feet.
Potion of Water Breathing (potion, uncommon). For one hour you can breathe underwater.
A pouch holding 35 gp and a silver locket with a portrait of Pell's brother.

Conclusion
If the characters put out the green flame, the drowned return to the sea and Saltmere's fleet can be mourned at last. If Odile's secret comes out, the town turns on her, and the Lantern Society marks the characters as enemies.`;

/*PARSER-START*/
const STAT_RE=/^(armor class|hit points|speed|challenge|saving throws|skills|senses|languages|damage (resistances|immunities|vulnerabilities)|condition immunities|proficiency bonus|(str|dex|con|int|wis|cha)\b)/i;
const PERSON_RE=/\b(woman|man|keeper|master|priest|priestess|fisherman|fisher|merchant|guard|captain|smuggler|child|boy|girl|sailor|innkeeper|noble|lord|lady|wizard|mage|cultist|elder|widow|hunter|thief|knight|soldier|scholar|sage|healer|blacksmith|bard|farmer|mayor|baron|duke|queen|king|prince|princess|witch|hermit|sheriff|cook|servant|apprentice|monk|druid)\b/i;
const TRAITS=[
  ['stern','Short, flat sentences. Never says please.','Taps the table while others talk.'],
  ['tired','Sighs before answering and repeats questions back.','Rubs their eyes and leans on things.'],
  ['nervous','Talks too fast and trails off mid-sentence.','Fidgets with something small and avoids eye contact.'],
  ['cheerful','Warm and sing-song; laughs at their own jokes.','Leans in close and touches people\'s arms.'],
  ['old','Slow, with long pauses to remember names.','Squints and lowers themself into chairs carefully.'],
  ['young','Eager; interrupts and asks questions back.','Can\'t stand still.'],
  ['gruff','Grunts and gives one-word answers until impressed.','Arms crossed, chin up.'],
  ['greedy','Steers every topic back to money.','Weighs coins in their hand while talking.'],
  ['suspicious','Answers questions with questions.','Watches the door; keeps a hand near a weapon.'],
  ['kind','Soft voice; uses the party\'s names.','Offers food or a seat before anything else.'],
  ['proud','Formal words; corrects other people\'s mistakes.','Straight back; never sits first.'],
  ['drunk','Slurred, overly honest, wanders off topic.','Sways and spills things.'],
  ['cruel','Quiet and amused at other people\'s pain.','Smiles at the wrong moments.'],
  ['riddle','Answers in riddles and half-truths.','Hums between sentences.'],
  ['fidget','Starts sentences twice.','Plays with whatever is in their hands.'],
  ['counts','Corrects numbers, even small ones.','Counts things under their breath.']
];
const sentences=t=>t.split(/(?<=[.!?])\s+/).filter(Boolean);
let _uid=0; const uid=p=>p+(Date.now().toString(36))+(_uid++);
function crNum(s){ if(!s) return 1; if(s.includes('/')){const [a,b]=s.split('/');return +a/+b;} return +s||1; }
function tierFor(cr){ if(cr<=0.25) return ['Minion',1]; if(cr<=1) return ['Standard',2]; if(cr<=4) return ['Elite',3]; return ['Boss',4]; }
function isHeading(l){
  if(!l) return false;
  if(l.startsWith('# ')) return true;
  if(STAT_RE.test(l)) return false;
  if(l.length>60 || /[.;,!?]$/.test(l) || /^[-•*]/.test(l)) return false;
  if(/^(part|chapter|act)\s+\w+/i.test(l) || /^map\b/i.test(l)) return true;
  const w=l.split(/\s+/); if(w.length>8) return false;
  const caps=w.filter(x=>/^[A-Z0-9&'"(]/.test(x)).length;
  return caps/w.length>=0.6;
}
function parseAdventure(raw){
  const lines=raw.replace(/\r/g,'').split('\n').map(l=>l.trim());
  const sections=[]; let cur={title:'Opening',paras:[]}; sections.push(cur);
  let para=null;
  const flush=()=>{ if(para){cur.paras.push(para); para=null;} };
  let headings=0;
  for(const l of lines){
    if(!l){ flush(); continue; }
    if(isHeading(l)){ flush(); headings++; cur={title:l.replace(/^#\s*/,''),paras:[]}; sections.push(cur); continue; }
    const startsNew=/^[-•*]\s|^[A-Z]{0,2}\d{1,2}\.\s/.test(l)||STAT_RE.test(l)||!para||/[.!?:"”)]$/.test(para)||STAT_RE.test(para);
    if(startsNew){ flush(); para=l; } else para+=' '+l;
  }
  flush();

  const out={beats:[],npcs:[],maps:[],enemies:[],items:[],hooks:[],stats:{headings,paras:0,sorted:0}};
  const seen=new Set();
  let lastMap=null;
  const sorted=new Set();
  for(const sec of sections){
    const t=sec.title, paras=sec.paras; out.stats.paras+=paras.length;
    const acIdx=paras.findIndex(p=>/^armor class\s+\d+/i.test(p));
    if(acIdx>=0){
      const get=re=>{const p=paras.find(x=>re.test(x)); return p?p.replace(re,'').trim():'';};
      const type=(paras.find(p=>/^(tiny|small|medium|large|huge|gargantuan)\b/i.test(p))||'').trim();
      const crRaw=(get(/^challenge\s*/i).match(/[\d/]+/)||[''])[0];
      const cr=crNum(crRaw); const [tier,slots]=tierFor(cr);
      const kind=(type.match(/\b(humanoid|undead|beast|construct|fiend|monstrosity|aberration|elemental|fey|giant|dragon|ooze|plant|celestial)\b/i)||['','creature'])[1].toLowerCase();
      const moves=paras.map(p=>p.match(/^([A-Z][A-Za-z' ]{2,30})\.\s/)).filter(m=>m&&!STAT_RE.test(m[1])).map(m=>m[1]);
      let breakAt=null, breaking='Fights until destroyed';
      if(kind==='humanoid'){ if(slots>1){breakAt=slots-1; breaking='Flees or surrenders once hurt';} else breaking='Drops or runs at the first hit'; }
      else if(kind==='beast'||kind==='monstrosity'){ breakAt=Math.max(1,slots-1); breaking='Flees when badly hurt'; }
      const goal={humanoid:'Get paid and get out alive',undead:'Drag the living into its domain',beast:'Eat or escape'}[kind]||'Defend its ground';
      const actions=paras.map(p=>p.match(/^([A-Z][\w'’ ()/,-]{1,48}?)\.\s+(.+)$/)).filter(m=>m&&!STAT_RE.test(m[1])).map(m=>({name:m[1].trim(),text:m[2]}));
      const hpStats=QBAttacks.fromStatBlock({hp:get(/^hit points\s*/i),ac:get(/^armor class\s*/i),cr:crRaw,kind,actions});
      out.enemies.push({id:uid('b'),name:t,type,ac:get(/^armor class\s*/i),hp:get(/^hit points\s*/i),cr:crRaw||'?',tier,slots,breakAt,breaking,goal,moves:moves.length?moves:['Attack'],...hpStats,include:true,why:'stat block: "Armor Class" + "Challenge"'});
      seen.add(t.toLowerCase()); sorted.add(sec); continue;
    }
    if(/hook|rumou?r/i.test(t)){
      paras.forEach(p=>out.hooks.push({id:uid('h'),text:p.replace(/^[-•*]\s*/,''),include:true,why:'listed under "'+t+'"'}));
      sorted.add(sec); continue;
    }
    if(/^map\b/i.test(t)){ lastMap={id:uid('m'),name:t.replace(/^map:?\s*/i,''),areas:[],include:true,why:'"Map" heading + keyed areas'}; out.maps.push(lastMap); sorted.add(sec); }
    const isTreasure=/treasure|loot|rewards|items/i.test(t);
    for(const p of paras){
      const area=p.match(/^([A-Z]{0,2}\d{1,2})\.\s+([^.]+)\.\s*(.*)$/);
      if(area){
        if(!lastMap){lastMap={id:uid('m'),name:t,areas:[],include:true,why:'keyed areas (A1., 2. …)'}; out.maps.push(lastMap);}
        lastMap.areas.push({key:area[1],name:area[2],desc:area[3]}); continue;
      }
      if(isTreasure){
        const name=p.split(/[(.]/)[0].trim();
        out.items.push({id:uid('i'),name,desc:p.slice(name.length).replace(/^\s*\([^)]*\)\.?\s*|^\.\s*/,''),rarity:(p.match(/\b(common|uncommon|rare|very rare|legendary)\b/i)||[''])[0],include:true,why:'listed under "'+t+'"'});
        sorted.add(sec); continue;
      }
      for(const m of p.matchAll(/\b(?:[Pp]otions?|[Ss]crolls?|[Rr]ings?|[Ww]ands?|[Cc]loaks?|[Aa]mulets?|[Bb]oots|[Ss]taffs?) of ((?:[A-Z][\w']+\s?)+)/g)){
        const name=m[0].trim().replace(/^./,c=>c.toUpperCase());
        if(!out.items.some(i=>i.name.toLowerCase()===name.toLowerCase())) out.items.push({id:uid('i'),name,desc:'Mentioned in "'+t+'"',rarity:'',include:true,why:'"… of <Name>" item pattern'});
      }
      const npc=p.match(/^([A-Z][a-z'’]+(?:\s[A-Z][a-z'’]+){0,2}),\s+(?:a|an|the)\s+([^,.]+)/);
      if(npc && (PERSON_RE.test(npc[2])||/\b(she|he|they)\b/i.test(p)) && !seen.has(npc[1].toLowerCase())){
        const desc=p, low=desc.toLowerCase(), ss=sentences(desc);
        const hits=TRAITS.filter(([k])=>new RegExp('\\b'+k).test(low));
        const secret=(ss.find(s=>/^secret\b/i.test(s))||'').replace(/^secret:?\s*/i,'');
        out.npcs.push({id:uid('n'),name:npc[1],role:npc[2].trim(),desc,
          wants:(ss.find(s=>/\b(wants?|seeks?|hopes?)\b/i.test(s))||'').trim(),
          fears:(ss.find(s=>/\b(fears?|afraid)\b/i.test(s))||'').trim(),
          secret,
          voice:hits[0]?hits[0][1]:'Borrow how someone you know talks, and keep it the same each time.',
          manner:(hits[1]||hits[0])?(hits[1]||hits[0])[2]:'Give them one repeated gesture the players will remember.',
          pressed:secret?'Lies at first. Gives the secret up if shown proof, threatened, or offered a way out.':'Has nothing to hide, but wants something in return for help.',
          include:true,why:'"Name, a/the role" pattern'+(hits.length?' + trait words: '+hits.map(h=>h[0]).join(', '):'')});
        seen.add(npc[1].toLowerCase()); sorted.add(sec);
      }
    }
    if(/^(part|chapter|act)\b/i.test(t)||/^(conclusion|epilogue|finale|introduction)\b/i.test(t)){
      const body=paras.join(' '); const ss=sentences(body);
      out.beats.push({id:uid('s'),title:t,summary:ss.filter(s=>!/^if the (characters|party)/i.test(s)).slice(0,2).join(' '),branches:ss.filter(s=>/^if the (characters|party)/i.test(s)),include:true,why:/^(part|chapter|act)/i.test(t)?'"Part / Chapter" heading':'"'+t+'" heading'});
      sorted.add(sec);
    }
  }
  out.stats.sorted=sorted.size; out.stats.sections=sections.length;
  return out;
}
/*PARSER-END*/

function sendToDesk(s,res){
  let n=0;
  const add=(arr,item,key='name')=>{ if(item.include===false) return; if(arr.some(x=>(x[key]||'').toLowerCase()===(item[key]||'').toLowerCase())) return; arr.push(item); n++; };
  res.beats.forEach(b=>add(s.beats,{...b,status:'upcoming'},'title'));
  const next=s.beats.find(b=>b.status!=='done');
  if(!s.beats.some(b=>b.status==='active')&&next) next.status='active';
  res.hooks.forEach(h=>add(s.hooks,{id:h.id,text:h.text,status:'dangling',clock:0,source:'Imported',include:h.include},'text'));
  res.npcs.forEach(x=>add(s.npcs,{...x,open:false}));
  res.enemies.forEach(x=>add(s.bestiary,x));
  res.maps.forEach(x=>add(s.maps,x));
  res.items.forEach(x=>add(s.items,x));
  return n;
}

// HP combat fields on an enemy: numbers read from the stat block, or from the text of older saves.

// The live sheet: every number calculated from the choices so far.

  if(t==='gear') body=`<p class="small">${esc(sheet.gear.items.map(x=>(x.count>1?x.count+' × ':'')+x.name+(x.from==='Granted by the DM'?' (granted)':'')).join(', ')||'Nothing yet')} · ${sheet.gear.gp} GP left</p><p class="small muted">Wearing: ${esc(D.equipment[sheet.gear.equipped.armor]?.name||'no armor')}${sheet.gear.equipped.shield?', shield':''}.</p>`;

function vCreate(){
  const c=crState(), sheet=crSheet(c), steps=crSteps(sheet); if(!steps.some(([k])=>k===c.step)) c.step='species';
  const i=steps.findIndex(([k])=>k===c.step), head=CR_HEAD[c.step];
  const stepper=`<div class="cr-steps" role="list">${steps.map(([k,l])=>{const n=crOpenIn(sheet,c,k);return `<button role="listitem" data-act="cr-step" data-v="${k}" ${k===c.step?'aria-current="step"':''} class="${n?'':'done'}">${l}${k==='review'?'':n?` <span class="badge">${n}</span>`:' ✓'}</button>`;}).join('')}</div>`;
  const foot=`<div class="cr-foot"><button class="btn" data-act="cr-step" data-v="${steps[i-1]?.[0]||''}" ${i===0?'disabled':''}>Back</button>${i<steps.length-1?`<button class="btn primary" data-act="cr-step" data-v="${steps[i+1][0]}">Next: ${steps[i+1][1]}</button>`:''}</div>`;

    <details class="cr-sheet-wrap" open><summary>View sheet</summary>${crSheetPanel(c,sheet)}</details></div>`;

// Creator actions; spread into ACT where it is defined.
function creatorActions(){ const B=()=>crState().build, D=()=>crData();
  return {
  'cr-step':d=>{ if(d.v) crState().step=d.v; window.scrollTo(0,0); },
  'cr-tab':d=>{ crState().tab=d.v; },
  'cr-species':d=>{ const b=B(); if(b.species!==d.v){ Object.assign(b,{species:d.v,sub:'',size:'',speciesSkill:'',keenSense:'',speciesFeat:''}); } },
  'cr-sub':d=>{ B().sub=d.v; },

    if(b.abilities.method==='array') b.abilities.base=crRecommended(d.v); if(b.abilities.method==='roll'&&b.abilities.rolls) ACT['cr-order'](); },
  'cr-quick':d=>{ const c=crState(); crSpells(()=>{ const b=crState().build; if(b.cls===d.v&&!b.spells.cantrips.length&&!b.spells.prepared.length) QBHeroRules.fillDefaults(b); }); const q=QBHeroRules.quickBuild(d.v,c.build.name,c.build.level,c.build.species?c.build:{}); c.build={...c.build,...q,equip:undefined};
    const bg=D().backgrounds.find(x=>x.id===q.background), two=Object.entries(q.boost); c.boostUI=two.length===3?{mode:'1-1-1',plus2:'',plus1:''}:{mode:'2-1',plus2:two.find(([,v])=>v===2)?.[0]||'',plus1:two.find(([,v])=>v===1)?.[0]||''};
    c.asiUI=Object.fromEntries(Object.entries(q.asi||{}).map(([lv,x])=>[lv,{feat:x.feat,mode:'2',a:Object.keys(x.plus)[0]||''}]));
    toast(`Quick build: ${D().species.find(x=>x.id===q.species)?.name}, ${bg.name} background, standard array. Change anything you like.`); },
  'cr-featview':d=>{ const c=crState(); c[d.v]=!c[d.v]; },
  'cr-level':d=>{ B().level=Number(d.v)||1; },
  'cr-hp':d=>{ B().hp.method=d.v; },
  'cr-hp-roll':d=>{ const b=B(), hd=D().classes.find(x=>x.id===b.cls)?.hitDie||8; if(!Number.isInteger(b.hp.rolls[d.v])) b.hp.rolls[d.v]=QBHeroRules.rollHp(hd); },
  'cr-method':d=>{ const a=B().abilities; a.method=d.v; if(d.v==='array') a.base=crRecommended(B().cls); if(d.v==='pointbuy') a.base=Object.fromEntries(ABIL.map(k=>[k,8])); if(d.v==='set'&&!a.base) a.base=Object.fromEntries(ABIL.map(k=>[k,10])); crState().swap=null; },
  'cr-roll':()=>{ const a=B().abilities; if(a.rolls) return; a.rolls=QBHeroRules.rollAbilities(); ACT['cr-order'](); },
  // Highest rolls go where the class needs them most; the player can swap afterwards.
  'cr-order':()=>{ const a=B().abilities, idx=a.rolls.map((r,i)=>i).sort((x,y)=>QBHeroRules.rollTotal(a.rolls[y])-QBHeroRules.rollTotal(a.rolls[x])); a.order=Object.fromEntries(crPriority(B().cls).map((k,i)=>[k,idx[i]])); },
  'cr-swap':d=>{ const c=crState(), a=c.build.abilities, map=a.method==='roll'?a.order:a.base; if(!c.swap){c.swap=d.v;return;} if(c.swap!==d.v){const t=map[c.swap]; map[c.swap]=map[d.v]; map[d.v]=t;} c.swap=null; },
  'cr-pb':d=>{ const base=B().abilities.base; base[d.k]=Math.max(8,Math.min(15,base[d.k]+(+d.d))); },
  'cr-bg':d=>{ const c=crState(), bg=D().backgrounds.find(x=>x.id===d.v); if(c.build.background===d.v) return; c.build.background=d.v; c.build.toolChoice='';
    const top=crPriority(c.build.cls).filter(k=>bg.abilities.includes(k)); c.boostUI={mode:'2-1',plus2:top[0]||bg.abilities[0],plus1:top[1]||bg.abilities[1]}; },
  'cr-boost':d=>{ crState().boostUI.mode=d.v; },
  'cr-keen':d=>{ B().keenSense=d.v; },
  'cr-toggle':d=>{ const b=B(), k=d.k, list=k==='cantrips'||k==='prepared'?(b.spells[k]||=[]):k==='skilled'||k==='lore'?(b.featPicks[k]||=[]):(b[k]||=[]); const i=list.indexOf(d.v);
    if(i>=0) list.splice(i,1); else if(list.length<(+d.max||99)) list.push(d.v); else toast(`You can choose ${d.max}. Untick one first.`); },

// Saving a file: on the published link the viewer only allows saves through its downloads capability (it asks the viewer first); a local copy uses a plain download link.
async function saveFile(name,text,done){
  const dl=window.claude?.use ? await window.claude.use('downloads').catch(()=>null) : null;
  if(dl){ try{ await dl.save({filename:name,data:text}); toast(done); }catch(e){ if(e?.code==='declined') toast('Export cancelled.'); else if(e?.code==='rate_limited') toast('A save is already waiting for your answer.'); else toast('Export is not available here.'); } return; }
  try{ const url=URL.createObjectURL(new Blob([text],{type:'application/json'})), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast(done); }catch{ toast('Export is not available in this browser.'); }
}

const HB_DAMAGE=['Acid','Bludgeoning','Cold','Fire','Force','Lightning','Necrotic','Piercing','Poison','Psychic','Radiant','Slashing','Thunder'];

function hbTraitFields(t,i){
  const p=`hbEdit.traits.${i}.`, sel=(k,opts,label)=>`<label class="f">${label}<select data-bind="${p}${k}" data-rerender>${crOpt('','Choose…',!t[k])}${opts.map(o=>Array.isArray(o)?crOpt(o[0],o[1],String(t[k])===String(o[0])):crOpt(o,o,String(t[k])===String(o))).join('')}</select></label>`;
  const txt=(k,label,rows)=>rows?`<label class="f">${label}<textarea data-bind="${p}${k}" rows="${rows}" maxlength="1000">${esc(t[k]||'')}</textarea></label>`:`<label class="f">${label}<input data-bind="${p}${k}" value="${esc(t[k]||'')}" maxlength="80"></label>`;
  const spells=globalThis.QBSPELLS||[];
  switch(t.block){
    case 'darkvision': return sel('range',[['60','60 ft (18 m)'],['120','120 ft (36 m)']],'Range');
    case 'resistance': return sel('damage',HB_DAMAGE,'Damage type');
    case 'saveAdvantage': return sel('condition',HB_CONDITIONS,'Condition');
    case 'skill': return sel('skill',QBHERO.skills.map(k=>[k.id,k.name]),'Skill');
    case 'cantrip': return spells.length?sel('spell',spells.filter(s=>s.level===0).map(s=>[s.id,s.name]),'Cantrip'):'<p class="small muted">Loading spells…</p>';
    case 'spell': return spells.length?sel('spell',spells.filter(s=>s.level>=1&&s.level<=2).map(s=>[s.id,`${s.name} (level ${s.level})`]),'Spell')+sel('level',[['3','From character level 3'],['5','From character level 5']],'Available'):'<p class="small muted">Loading spells…</p>';
    case 'natural': return txt('name','Name (Claws, Bite …)')+sel('dice',['1d4','1d6','1d8'],'Damage die')+sel('type',['Slashing','Piercing','Bludgeoning'],'Damage type')+`<label><input type="checkbox" data-bind="${p}finesse" data-rerender ${t.finesse?'checked':''}> Can use Dexterity (finesse)</label>`;
    case 'custom': case 'drawback': return txt('name','Name')+txt('desc','What it does',2)+sel('weight',[['1',t.block==='drawback'?'Minor (−1)':'Small (1)'],['2',t.block==='drawback'?'Real (−2)':'Strong (2)'],['3',t.block==='drawback'?'Severe (−3)':'Very strong (3)']],t.block==='drawback'?'How much it hurts':'How strong (DM rating)');
    case 'flight': case 'action': case 'minor': return txt('name','Name')+txt('desc','What it does',2);
    default: return '';
  }
}

    <section class="card stack"><h3>Written features</h3><p class="small muted">Shown on the sheet as text; not calculated.</p>${list('features',(x,i)=>`${lvl(`features.${i}.level`,x.level)}${txt(`features.${i}.name`,x.name,'Name')}<textarea data-bind="hbEdit.features.${i}.desc" rows="2" maxlength="2000" placeholder="What it does">${esc(x.desc||'')}</textarea>`,'Add a feature')}</section>
    <section class="card stack"><h3>Subclass (level 3)</h3><label class="f">Name${txt('subclass.name',e.subclass.name,'Armorer, Path of …')}</label><label class="f">In one line${txt('subclass.summary',e.subclass.summary,'Wear arcane armor that becomes your weapon.',500)}</label>
      <div class="cr-checks">${[['heavy','Heavy armor training at level 3'],['martial','Martial weapon training at level 3']].map(([k,l])=>chk('subclass.training',k,e.subclass.training.includes(k),l)).join('')}</div>
      <details><summary class="small"><b>Tools at level 3</b> (${e.subclass.tools.length?esc(e.subclass.tools.join(', ')):'none'})</summary><div class="cr-checks">${TOOLS.map(n=>chk('subclass.tools',n,e.subclass.tools.includes(n),esc(n))).join('')}</div></details>
      ${(e.subclass.features||[]).map((x,i)=>`<div class="row hb-item">${lvl(`subclass.features.${i}.level`,x.level)}${txt(`subclass.features.${i}.name`,x.name,'Name')}<textarea data-bind="hbEdit.subclass.features.${i}.desc" rows="2" maxlength="2000">${esc(x.desc||'')}</textarea><button class="btn sm ghost" data-act="hb-crow-del" data-k="subclass.features" data-v="${i}" aria-label="Remove">×</button></div>`).join('')}<button class="btn sm" data-act="hb-crow-add" data-k="subclass.features">Add a subclass feature</button></section>
    <section class="card stack"><h3>Starting kit</h3><p class="small muted">Players take this kit or its value in gold. SRD class kits are worth ${QBHomebrew.CLASS_KIT.min}–${QBHomebrew.CLASS_KIT.max} GP.</p>
      ${e.kit.items.map((it,i)=>`<div class="row hb-item"><span>${esc(D.equipment[it.id]?.name||it.id)} <span class="small muted">${esc(D.equipment[it.id]?.cost||'')}</span></span><input type="number" min="1" max="99" step="1" data-bind="hbEdit.kit.items.${i}.count" value="${esc(it.count)}" aria-label="How many"><button class="btn sm ghost" data-act="hb-delitem" data-v="${i}" aria-label="Remove">×</button></div>`).join('')}

      <p class="cr-count">Kit value: ${QBHomebrew.kitValue(e.kit)} GP</p></section>
    <div class="cr-foot"><button class="btn" data-act="hb-cancel">Cancel</button><button class="btn primary" data-act="hb-save">Save class</button></div></div>
    <aside class="cr-sheet"><div class="eyebrow">Compared with the 12 SRD classes</div><h3>${ok?'Within the SRD range':'Not finished, or outside the range'}</h3>
      <ul class="hb-checks">${all.map(c=>`<li class="${c.ok?'ok':'warn'}">${c.ok?'✓':'⚠'} <b>${esc(c.label)}</b>${c.detail?' · '+esc(c.detail):''}</li>`).join('')}</ul>
      ${power.rows.length?`<table class="cr-table"><tr><th>Level</th><th>HP</th><th>AC</th><th>Damage / action</th></tr>${power.rows.map(r=>`<tr class="${r.flags.length?'hb-over':''}"><td>${r.level}</td><td><b>${r.mine.hp}</b> <span class="small muted">${r.min.hp}–${r.max.hp}</span></td><td><b>${r.mine.ac}</b> <span class="small muted">${r.min.ac}–${r.max.ac}</span></td><td><b>${r.mine.dpa}</b> <span class="small muted">${r.min.dpa}–${r.max.dpa}</span><br><span class="small muted">${esc(r.mine.attack)}</span></td></tr>`).join('')}</table>
      <p class="small muted">Bold: your class (its Quick build hero). Grey: the weakest and strongest SRD class. Damage per action is against AC 15, grazes counted. Spell slots and limited features aren’t counted, so casters are stronger than this shows.</p>
      <button class="btn sm" data-act="hb-fighttest">Test in fights…</button><div id="hb-fight-out">${S.hbFight?.id===e.id?S.hbFight.html:''}</div>`:''}</aside></div>`;
}
// The feat editor: what kind of feat, from which level, an optional +1, and what it does in the DM's own words.
function hbFeatEditor(){
  const e=S.hbEdit; e.prereq??=QBHomebrew.newPrereq(); const p=e.prereq, others=hbState().feats.filter(x=>x.id!==e.id), T=QBHomebrew.FEAT_TYPES, checks=QBHomebrew.checkFeat(e,others), ok=checks.every(x=>x.ok), srd=QBHERO.feats.filter(x=>x.type===e.type);
  const needsPlus=e.type==='general'||e.type==='epic-boon';
  return `<div class="cr-layout"><div class="cr-main">
    <section class="card stack"><h3>The feat</h3><label class="f">Name<input data-bind="hbEdit.name" value="${esc(e.name)}" placeholder="Tough Hide, Night Hunter…" maxlength="80"></label>
      <label class="f">Kind<select data-act-change="hb-feattype">${Object.entries(T).map(([k,x])=>crOpt(k,x.label,e.type===k)).join('')}</select></label>
      <label><input type="checkbox" data-act="hb-cflag" data-p="repeatable" ${e.repeatable?'checked':''}> A hero may take it more than once</label></section>
    <section class="card stack"><h3>Ability increase</h3><p class="small muted">${needsPlus?'2024 general feats and Epic Boons raise one ability by 1. Tick the abilities a player may choose from (all six means any).':'Origin and Fighting Style feats don’t raise abilities in the 2024 rules.'}</p>
      ${needsPlus?`<div class="cr-checks">${ABIL.map(k=>`<label class="cr-check ${e.abilities.includes(k)?'on':''}"><input type="checkbox" data-act="hb-ctoggle" data-p="abilities" data-v="${k}" ${e.abilities.includes(k)?'checked':''}> ${APPROACH[k].name} (${k})</label>`).join('')}</div>`:''}</section>
    <section class="card stack"><h3>Prerequisites</h3><p class="small muted">Use them only when the feat truly needs them. The creator only offers the feat to heroes who meet them.</p>
      <p class="small"><b>An ability score</b> (any one of the ticked)</p><div class="cr-checks">${ABIL.map(k=>`<label class="cr-check ${p.abilities.includes(k)?'on':''}"><input type="checkbox" data-act="hb-ctoggle" data-p="prereq.abilities" data-v="${k}" ${p.abilities.includes(k)?'checked':''}> ${k}</label>`).join('')}</div>
      ${p.abilities.length?`<label class="f">Of at least<select data-bind="hbEdit.prereq.score" data-rerender>${[13,14,15,16,17].map(n=>crOpt(n,n+(n===13?' (usual)':' (stricter)'),Number(p.score)===n)).join('')}</select></label>`:''}
      <label><input type="checkbox" data-act="hb-cflag" data-p="prereq.spellcasting" ${p.spellcasting?'checked':''}> The Spellcasting or Pact Magic feature</label>
      <div class="row"><label class="f">Another feat<select data-bind="hbEdit.prereq.feat" data-rerender>${crOpt('','None',!p.feat)}${[...QBHERO.feats,...others].map(x=>crOpt(x.id,x.name+(x.homebrew||x.kind==='feat'?' (homebrew)':''),p.feat===x.id)).join('')}</select></label>
      <label class="f">A class<select data-bind="hbEdit.prereq.cls" data-rerender>${crOpt('','Any class',!p.cls)}${[...QBHERO.classes,...hbState().classes].map(c=>crOpt(c.id,c.name,p.cls===c.id)).join('')}</select></label></div>
      <label class="f">Anything else (shown, not checked)<input data-bind="hbEdit.prereq.text" value="${esc(p.text||'')}" placeholder="the Rage feature, the ability to cast Mage Hand…" maxlength="300"></label></section>
    <section class="card stack"><h3>What it does</h3><p class="small muted">Shown on the hero sheet. Write it in your own words; Quillbound doesn’t calculate it, so note numbers the player should use.</p>
      <textarea data-bind="hbEdit.desc" rows="6" maxlength="3000" placeholder="When you…">${esc(e.desc)}</textarea></section>
    <div class="cr-foot"><button class="btn" data-act="hb-cancel">Cancel</button><button class="btn primary" data-act="hb-save">Save feat</button></div></div>
    <aside class="cr-sheet"><div class="eyebrow">Checked against the 2024 structure</div><h3>${ok?'Ready for approval':'Not finished'}</h3>
      <ul class="hb-checks">${checks.map(c=>`<li class="${c.ok?'ok':'warn'}">${c.ok?'✓':'⚠'} <b>${esc(c.label)}</b>${c.detail?' · '+esc(c.detail):''}</li>`).join('')}</ul>
      <p class="small"><b>SRD feats of this kind:</b> ${esc(srd.map(x=>x.name).join(', ')||'none')}</p>
      <p class="small muted">There is no power score for feats: compare it with the SRD feats above and decide when you approve it.</p>
      <h4>Design tips</h4><ul class="small">${QBHomebrew.featAdvice(e).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="small muted">From the D&amp;D Wiki feat design guides. Tips never block approval.</p></aside></div>`;
}
function vHomebrew(){
  QBHeroRules.setHomebrew(QBHomebrew.forCreator(hbState())); // approved homebrew feats can be chosen and required here too
  const hb=hbState(), kind=S.hbKind||'backgrounds', one=kind==='species'?'species':kind==='classes'?'class':kind==='feats'?'feat':'background';
  if(S.hbEdit?.kind==='feat') return `<div class="pagehead"><div><div class="eyebrow">Homebrew · feat</div><h2>${esc(S.hbEdit.name||'New feat')}</h2><p>Name it, choose its kind and level, and describe what it does. Approved feats appear in the creator wherever a feat of that kind is chosen.</p></div></div>${hbFeatEditor()}`;
  if(S.hbEdit?.kind==='class') return `<div class="pagehead"><div><div class="eyebrow">Homebrew · class</div><h2>${esc(S.hbEdit.name||'New class')}</h2><p>Build the class from a base, a progression and features. The panel on the right measures it against all 12 SRD classes at levels 1, 5, 11 and 17.</p></div></div>${hbClassEditor()}`;
  if(S.hbEdit) return S.hbEdit.kind==='species'
    ?`<div class="pagehead"><div><div class="eyebrow">Homebrew · species</div><h2>${esc(S.hbEdit.name||'New species')}</h2><p>Pick traits from building blocks. Each has a weight; the panel on the right places your species among the SRD ones.</p></div></div>${hbSpeciesEditor()}`
    :`<div class="pagehead"><div><div class="eyebrow">Homebrew · background</div><h2>${esc(S.hbEdit.name||'New background')}</h2><p>Build inside the 2024 structure. The panel on the right checks each part and compares it with the SRD backgrounds.</p></div></div>${hbEditor()}`;
  const list=hb[kind]||[], fits=b=>kind==='species'?QBHomebrew.speciesFits(b):kind==='classes'?QBHomebrew.classFits(b):kind==='feats'?QBHomebrew.featFits(b,hb.feats.filter(y=>y.id!==b.id)):QBHomebrew.fits(b);
  const line=b=>kind==='feats'?`${esc(QBHomebrew.FEAT_TYPES[b.type]?.label.split(' (')[0]||'')} · level ${QBHomebrew.FEAT_TYPES[b.type]?.minLevel||1}+${b.abilities.length?' · +1 '+esc(b.abilities.length===6?'any ability':b.abilities.join(' or ')):''}${b.repeatable?' · repeatable':''}`
    :kind==='classes'?`d${b.hitDie} · ${esc(b.primary.join(', '))} · saves ${esc(b.saves.join(', '))} · ${b.caster==='none'?'no spells':esc(b.caster)+' caster'}${b.extraAttack?' · Extra Attack':''} · subclass ${esc(b.subclass.name||'?')}`
    :kind==='species'
    ?`${esc(b.size)} · ${Number(b.speed)+(b.traits.some(t=>t.block==='speed')?5:0)} ft · score ${QBHomebrew.speciesScore(b)} (SRD ${QBHomebrew.BAND.min}–${QBHomebrew.BAND.max}) · ${esc(QBHomebrew.speciesToSrd(b).traits.map(t=>t.name).join(', '))}`
    :`${esc(b.abilities.join(', '))} · ${esc(QBHERO.feats.find(f=>f.id===b.feat)?.name||'no feat')} · ${esc(b.skills.map(s=>QBHERO.skills.find(k=>k.id===s)?.name||s).join(', '))} · ${esc(b.tool||'no tool')} · kit ${QBHomebrew.kitValue(b.kit)} GP`;
  return `<div class="pagehead"><div><div class="eyebrow">Homebrew · DM only</div><h2>Your own options</h2><p>Make your own backgrounds, species, classes and feats inside the 2024 rules. The app compares them with the SRD; you decide what players may use by approving it.</p></div>
      <div class="row"><button class="btn" data-act="hb-export" ${(hb.backgrounds.length||hb.species.length||hb.classes.length||hb.feats.length)?'':'disabled'}>Export…</button><label class="btn">Import…<input type="file" id="hb-file" accept=".json,application/json" hidden></label></div></div>
    <div class="cr-tabs" role="tablist">${HB_KINDS.map(([k,l,ready])=>`<button role="tab" aria-selected="${kind===k}" data-act="hb-kind" data-v="${k}" ${ready?'':'disabled'}>${l}${ready?'':' · coming next'}</button>`).join('')}</div>
    <div class="row" style="margin:12px 0"><button class="btn primary" data-act="hb-new">New ${one}</button></div>
    <div class="results">${list.map(b=>{const fit=fits(b);return `<article class="card stack"><div class="row" style="justify-content:space-between"><h3>${esc(b.name||'Unnamed '+one)}</h3><span class="chip ${fit?'ok':'warn'}">${fit?(kind==='backgrounds'||kind==='feats'?'Fits the 2024 structure':'Within the SRD range'):'Draft: not finished'}</span></div>
      <p class="small">${line(b)}</p>${b.desc?`<p class="small muted">${esc(b.desc)}</p>`:''}
      <div class="row"><label class="cr-check ${b.approved?'on':''}"><input type="checkbox" data-act="hb-approve" data-v="${b.id}" ${b.approved?'checked':''}> Approved by the DM: players can choose it</label><button class="btn sm" data-act="hb-edit" data-v="${b.id}">Edit</button><button class="btn sm ghost" data-act="hb-del" data-v="${b.id}">Delete</button></div></article>`;}).join('')||`<div class="empty">No homebrew ${kind} yet. Choose New ${one} to make one.</div>`}</div>
    <p class="small muted">Heroes keep a copy of the homebrew they were made with, so editing or deleting it later doesn’t change existing heroes.</p>`;
}
// Read an import file, then let the DM decide about every clash before anything changes.
function hbImportFile(file){ file.text().then(text=>{ const hb=hbState(), parsed=QBHomebrew.parseImport(text,hb); if(parsed.error){ toast(parsed.error); return; }
  const dlg=openDialog('Import homebrew',`<p>${parsed.items.length} item${parsed.items.length===1?'':'s'} in this file. Imported homebrew starts unapproved.</p>
    <ul>${parsed.items.map(b=>`<li><b>${esc(b.name)}</b>${parsed.clashes.includes(b.id)?` · you already have one with this name<select data-clash="${esc(b.id)}">${crOpt('skip','Keep mine, skip this one',true)}${crOpt('copy','Keep both (import as a copy)',false)}${crOpt('replace','Replace mine with this one',false)}</select>`:''}</li>`).join('')}</ul>
    <div class="row"><button class="btn primary" id="hb-import-go">Import</button><button class="btn" id="hb-import-cancel">Cancel</button></div>`);
  dlg.querySelector('#hb-import-cancel').onclick=()=>dlg.close();
  dlg.querySelector('#hb-import-go').onclick=()=>{ const decisions={}; dlg.querySelectorAll('[data-clash]').forEach(s=>decisions[s.dataset.clash]=s.value); const r=QBHomebrew.applyImport(hb,parsed,decisions); S.homebrew=r.hb; dlg.close(); render(); toast(`Imported: ${r.done.added} added, ${r.done.replaced} replaced, ${r.done.skipped} skipped.`); };
}).catch(()=>toast('This file could not be read.')); }
function homebrewActions(){ const find=id=>{const hb=hbState(); for(const k of ['backgrounds','species','classes','feats']){const x=hb[k].find(b=>b.id===id); if(x) return {k,x};} return {};};
  const fitsOf=x=>x.kind==='species'?QBHomebrew.speciesFits(x):x.kind==='class'?QBHomebrew.classFits(x):x.kind==='feat'?QBHomebrew.featFits(x,hbState().feats.filter(y=>y.id!==x.id)):QBHomebrew.fits(x);
  return {
  'hb-kind':d=>{ S.hbKind=d.v; },
  'hb-new':()=>{ S.hbEdit=S.hbKind==='species'?QBHomebrew.newSpecies():S.hbKind==='classes'?QBHomebrew.newClass():S.hbKind==='feats'?QBHomebrew.newFeat():QBHomebrew.newBackground(); window.scrollTo(0,0); },
  'hb-edit':d=>{ S.hbEdit=JSON.parse(JSON.stringify(find(d.v).x)); window.scrollTo(0,0); },
  'hb-cancel':()=>{ S.hbEdit=null; },
  'hb-save':()=>{ const hb=hbState(), src=S.hbEdit, e={...src,name:String(src.name||'').trim(),updated:Date.now()};
    if(e.kind==='species') Object.assign(e,{speed:Number(e.speed)||30});
    if(e.kind==='class') for(const k of ['hitDie','cantrips','fightingStyle','mastery','sneakFrom','martialArtsFrom']) e[k]=Number(e[k])||0;
    if(e.kind==='feat'){ e.minLevel=QBHomebrew.FEAT_TYPES[e.type]?.minLevel||4; if(!['general','epic-boon'].includes(e.type)) e.abilities=[]; }
    if(e.kind!=='species'&&e.kind!=='feat') e.kit={items:src.kit.items.map(i=>({id:i.id,count:Math.max(1,Math.round(Number(i.count)||1))})),gp:Math.max(0,Math.round(Number(src.kit.gp)||0))};
    if(!e.name){ toast('Give it a name first.'); return; }
    const list=e.kind==='species'?hb.species:e.kind==='class'?hb.classes:e.kind==='feat'?hb.feats:hb.backgrounds, i=list.findIndex(b=>b.id===e.id); if(i>=0) list[i]=e; else list.push(e);
    if(e.approved&&!fitsOf(e)) { e.approved=false; toast('Saved. It no longer fits, so it is unapproved until you approve it again.'); } else toast('Saved.');
    S.hbEdit=null; },
  'hb-toggle':d=>{ const list=S.hbEdit[d.k], i=list.indexOf(d.v); if(i>=0) list.splice(i,1); else if(list.length<+d.max) list.push(d.v); else toast(`Choose ${d.max}. Untick one first.`); },
  'hb-additem':d=>{ if(!d.v) return; const it=S.hbEdit.kit.items.find(x=>x.id===d.v); if(it) it.count=(Number(it.count)||1)+1; else S.hbEdit.kit.items.push({id:d.v,count:1}); },
  'hb-delitem':d=>{ S.hbEdit.kit.items.splice(+d.v,1); },
  'hb-addtrait':d=>{ if(!d.v) return; const t={block:d.v}; if(d.v==='darkvision') t.range='60'; if(d.v==='natural') Object.assign(t,{name:'Claws',dice:'1d6',type:'Slashing',finesse:false}); if(d.v==='spell') t.level='3'; if(d.v==='custom'||d.v==='drawback') t.weight='1'; S.hbEdit.traits.push(t); },
  'hb-deltrait':d=>{ S.hbEdit.traits.splice(+d.v,1); },
  // feat editor: the kind sets the level (origin and Fighting Style 1, general 4, Epic Boon 19) and drops a +1 it can't have
  'hb-feattype':d=>{ const e=S.hbEdit, min=QBHomebrew.FEAT_TYPES[d.v]?.minLevel||1; e.type=d.v; e.minLevel=min; if(d.v==='origin'||d.v==='fighting-style') e.abilities=[]; },
  // class editor: toggles in nested lists ("skills.from"), flags, and rows (features, attacks, expertise)
  'hb-ctoggle':d=>{ const path=d.p.split('.'); let o=S.hbEdit; for(const k of path.slice(0,-1)) o=o[k]; const list=o[path[path.length-1]], i=list.indexOf(d.v); if(i>=0) list.splice(i,1); else if(list.length<(+d.max||99)) list.push(d.v); else toast(`Choose ${d.max}. Untick one first.`); },
  'hb-cflag':d=>{ const path=d.p.split('.'); let o=S.hbEdit; for(const k of path.slice(0,-1)) o=o[k]; const k=path.at(-1); o[k]=!o[k]; },
  'hb-crow-add':d=>{ const blank={expertise:{level:1,count:1},attacks:{level:1,name:'',dice:'1d6',ability:'INT',type:''},features:{level:1,name:'',desc:''},'subclass.features':{level:3,name:'',desc:''}}[d.k]; const list=d.k==='subclass.features'?S.hbEdit.subclass.features:S.hbEdit[d.k]; list.push({...blank}); },
  'hb-crow-del':d=>{ const list=d.k==='subclass.features'?S.hbEdit.subclass.features:S.hbEdit[d.k]; list.splice(+d.v,1); },
  'hb-fighttest':()=>{ const e=S.hbEdit, lv=5; crSpells(()=>render()); const r=QBHomebrew.fightTest(e,lv,150);
    S.hbFight={id:e.id,html:`<p class="small"><b>Level ${r.level}</b>, parties of four identical heroes, 150 fights each: ${esc(r.encounters.join(' · '))}.</p><table class="cr-table"><tr><th>Party</th>${r.encounters.map(x=>'<th>'+esc(x.split(':')[0])+'</th>').join('')}</tr>${r.rows.map(row=>'<tr class="'+(row.name===(e.name||'Yours')?'hb-mine':'')+'"><td>'+esc(row.name)+'</td>'+row.cells.map(c=>'<td>'+c.rounds+' rounds · '+c.dropped+'% drop · '+c.wiped+'% wiped</td>').join('')+'</tr>').join('')}</table><p class="small muted">Stakes rules, fair dice; no healing, stamina or breaking points, so it compares classes rather than tactics.</p>`}; },
  'hb-approve':d=>{ const {x:b}=find(d.v); if(!b) return; if(!b.approved&&!fitsOf(b)){ toast('Finish it first: every check needs a ✓ before players can use it.'); return; } b.approved=!b.approved; toast(b.approved?`${b.name} is now available in the hero creator.`:`${b.name} is hidden from the hero creator. Heroes already made with it keep their copy.`); },
  'hb-del':d=>{ const {k,x:b}=find(d.v); if(!b) return; clConfirm(`Delete ${b.name||'this homebrew'}?`,'This removes it from your homebrew and from the hero creator. Heroes already made with it keep their copy. This cannot be undone; export it first if you might want it back.',()=>{ S.homebrew[k]=S.homebrew[k].filter(x=>x.id!==d.v); },'Delete'); },
  'hb-export':()=>{ saveFile('quillbound-homebrew.json',QBHomebrew.exportJson(hbState()),'Exported. The file holds your homebrew without approvals; whoever imports it decides what to approve.'); }
}; }
