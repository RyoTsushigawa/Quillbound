name: Invitation security rules
on:
  pull_request:
    paths:
      - firestore.rules
      - tests/invite-rules.test.cjs
      - .github/workflows/invitation-rules.yml
  workflow_dispatch:
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false firebase-tools@14 @firebase/rules-unit-testing@5 firebase@11
      - run: npx firebase emulators:exec --only firestore --project quillbound-invite-rules-test 'node --test tests/invite-rules.test.cjs'
